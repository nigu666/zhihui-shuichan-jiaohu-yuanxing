<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>智慧水产-设备管理助手</title>
  <link rel="preconnect" href="https://unpkg.com" crossorigin>
  <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
    }
    
    ::placeholder {
      color: #9E9E9E;
    }
    
    :-ms-input-placeholder {
      color: #9E9E9E;
    }
    
    ::-webkit-input-placeholder {
      color: #9E9E9E;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', 'WenQuanYi Micro Hei', 'Noto Sans CJK SC', 'Source Han Sans SC', 'Heiti SC', sans-serif;
      background: linear-gradient(135deg, #EDE7F6 0%, #F3E5F5 30%, #E8EAF6 60%, #FCE4EC 100%);
      color: #212121;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    /* 移动端：直接铺满整个视口，去掉桌面端的"展示框"外壳 */
    .iphone-frame {
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: linear-gradient(135deg, #EDE7F6 0%, #F3E5F5 30%, #E8EAF6 60%, #FCE4EC 100%);
      position: relative;
      overflow: hidden;
    }

    /* 真机已经有系统状态栏，App 内嵌的假状态栏在移动端隐藏 */
    .status-bar-fake {
      display: none !important;
    }

    /* 真机自带刘海/灵动岛，假的刘海只用于桌面端展示 */
    .iphone-notch {
      display: none;
    }

    .iphone-screen {
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    /* 真机有 Home Indicator，假的 indicator 隐藏 */
    .iphone-home-indicator {
      display: none;
    }

    /* 桌面端（>= 769px）恢复为手机展示框样式 */
    @media (min-width: 769px) {
      body {
        background: linear-gradient(135deg, #D1C4E9 0%, #E1BEE7 30%, #C5CAE9 60%, #F8BBD9 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: auto;
      }
      .iphone-frame {
        width: 390px;
        height: 844px;
        background: linear-gradient(135deg, #EDE7F6 0%, #F3E5F5 30%, #E8EAF6 60%, #FCE4EC 100%);
        border-radius: 54px;
        padding: 12px;
        box-shadow: 0 25px 80px rgba(94, 53, 177, 0.15), 0 10px 30px rgba(94, 53, 177, 0.08);
        flex-shrink: 0;
      }
      .iphone-notch {
        display: block;
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        width: 160px;
        height: 34px;
        background: #000;
        border-bottom-left-radius: 20px;
        border-bottom-right-radius: 20px;
        z-index: 100;
      }
      .iphone-screen {
        background: #F8F9FA;
        border-radius: 44px;
      }
      .iphone-home-indicator {
        display: block;
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: 134px;
        height: 5px;
        background: rgba(0,0,0,0.3);
        border-radius: 3px;
        z-index: 100;
      }
      .status-bar-fake {
        display: flex !important;
      }
    }
    
    .content-scroll {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 0 16px;
      scrollbar-width: none;
    }
    .content-scroll::-webkit-scrollbar { display: none; }

    .device-filter-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      min-width: 0;
    }
    .device-filter-control { position: relative; min-width: 0; z-index: 2; }
    .device-filter-select {
      width: 100%;
      min-width: 0;
      height: 40px;
      padding: 0 28px 0 9px;
      border: 1px solid #D9D2E8;
      border-radius: 10px;
      background: #fff;
      color: #34303E;
      font-size: 12px;
      outline: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: none;
    }
    .device-filter-select:focus { border-color: #7E57C2; }
    .device-filter-select option { font-size: 13px; line-height: 32px; color: #34303E; background: #fff; }
    .device-filter-chevron { position: absolute; right: 9px; top: 50%; width: 14px; height: 14px; transform: translateY(-50%); color: #5E35B1; pointer-events: none; }
    .device-list-scroll { padding: 0 16px calc(166px + env(safe-area-inset-bottom, 0px)); }
    .device-stats-card { margin: 0 16px 14px; padding: 13px 14px; background: #fff; border: 1px solid #E8E4EE; border-radius: 14px; box-shadow: 0 2px 8px rgba(33, 26, 48, .05); }
    .device-stats-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-bottom: 10px; border-bottom: 1px solid #F0EDF4; }
    .device-stats-content { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; padding-top: 12px; }
    .device-stats-total { white-space: nowrap; color: #27232E; }
    .device-stats-total strong { font-size: 30px; line-height: 1; }
    .device-stats-total span { margin-left: 4px; color: #7C7586; font-size: 13px; }
    .device-status-list { display: grid; gap: 6px; }
    .device-status-filter { display: grid; grid-template-columns: 7px 28px 20px; align-items: center; gap: 6px; min-height: 20px; padding: 0; border: 0; background: transparent; color: #5F5969; font-size: 12px; text-align: left; white-space: nowrap; }
    .device-status-filter.active { color: #512DA8; font-weight: 650; }
    .device-status-dot { width: 7px; height: 7px; border-radius: 50%; }
    .device-list-card { padding: 14px; border: 1px solid #E9E5EE; border-radius: 14px; background: #fff; box-shadow: 0 2px 7px rgba(33, 26, 48, .05); cursor: pointer; min-width: 0; }
    .device-list-card-inner { display: grid; grid-template-columns: 42px minmax(0, 1fr); gap: 11px; align-items: start; }
    .device-list-icon { width: 42px; height: 42px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: #F2EEFB; color: #5E35B1; }
    .device-list-icon svg { width: 21px; height: 21px; stroke-width: 1.8; }
    .device-card-main { min-width: 0; }
    .device-card-title-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; gap: 8px; }
    .device-card-name { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: 15px; line-height: 20px; font-weight: 650; color: #2C2834; }
    .device-repair-label { flex: 0 0 auto; padding: 1px 0; color: #D32F2F; font-size: 11px; font-weight: 650; white-space: nowrap; }
    .device-card-meta { margin-top: 3px; color: #807989; font-size: 12px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .device-card-tags { display: flex; align-items: center; gap: 7px; margin-top: 9px; white-space: nowrap; overflow: hidden; }
    .device-card-tag { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border: 1px solid #E2DDEA; border-radius: 7px; color: #625B6E; background: #FAF9FB; font-size: 11px; }
    .device-card-tag.mode { color: #5E35B1; border-color: #DDD3F1; background: #F8F5FE; }
    .device-control-disabled {
      opacity: .72;
      cursor: not-allowed !important;
      filter: saturate(.72);
    }
    @media (max-width: 340px) { .device-filter-grid { gap: 6px; } .device-filter-select { font-size: 11px; padding-left: 7px; padding-right: 25px; } .device-filter-chevron { right: 7px; } .device-stats-content { gap: 9px; } .device-stats-total strong { font-size: 27px; } .device-list-scroll { padding-left: 12px; padding-right: 12px; } .device-stats-card { margin-left: 12px; margin-right: 12px; } }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.7);
      box-shadow: 
        0 8px 32px rgba(94, 53, 177, 0.12),
        0 2px 8px rgba(94, 53, 177, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.9),
        inset 0 -1px 0 rgba(255, 255, 255, 0.3);
    }
    
    .glass-card-soft {
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 
        0 4px 20px rgba(94, 53, 177, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }
    
    .clickable {
      transition: transform 150ms ease;
      cursor: pointer;
    }
    .clickable:active {
      transform: scale(0.97);
    }
    
    .fade-in {
      animation: fadeInUp 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      opacity: 0;
    }
    
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .input-bar-bottom {
      overflow: hidden;
      transition: max-height 0.2s cubic-bezier(0.2, 0.8, 0.2, 1), margin 0.2s ease;
    }
    
    .input-bar-bottom.collapsed {
      max-height: 0;
      margin-top: 0;
      pointer-events: none;
    }
    
    .input-bar-bottom.expanded {
      max-height: 60px;
      margin-top: 12px;
      pointer-events: auto;
    }
    
    .rotate-icon {
      transition: transform 300ms ease;
    }
    .rotate-icon.expanded {
      transform: rotate(180deg);
    }
    
    .doctor-float {
      animation: doctorFloat 3s ease-in-out infinite;
    }
    @keyframes doctorFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    
    .wave-hand {
      animation: waveHand 1.5s ease-in-out infinite;
      transform-origin: 70% 55%;
    }
    @keyframes waveHand {
      0%, 100% { transform: rotate(0deg); }
      25% { transform: rotate(-15deg); }
      75% { transform: rotate(5deg); }
    }
    
    .trend-line {
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
      animation: drawLine 1s ease forwards;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.2); }
    }
    
    .status-bar-time {
      font-variant-numeric: tabular-nums;
      letter-spacing: -0.3px;
    }
    
    .greeting-glow {
      position: absolute;
      top: -40px;
      right: -60px;
      width: 280px;
      height: 280px;
      background: radial-gradient(circle, rgba(167,139,250,0.15) 0%, rgba(126,87,194,0.06) 40%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    
    .page-enter {
      animation: pageEnter 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    @keyframes pageEnter {
      from { opacity: 0; transform: translateX(20px); }
      to { opacity: 1; transform: translateX(0); }
    }
    
    .func-btn-shadow {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
    
    .qa-card-shadow {
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.06);
    }
    
    .sticky-top {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }
    
    .sticky-bottom {
      position: sticky;
      bottom: 0;
      z-index: 200;
      background: linear-gradient(0deg, rgba(255, 255, 255, 0.8) 0%, transparent 100%);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    
    .toast-container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 200;
      pointer-events: none;
    }
    
    .toast {
      background: rgba(0, 0, 0, 0.75);
      color: #fff;
      padding: 12px 24px;
      border-radius: 24px;
      font-size: 14px;
      font-weight: 500;
      white-space: nowrap;
      animation: toastIn 0.3s ease, toastOut 0.3s ease 1.7s forwards;
    }
    
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(10px) scale(0.95); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0) scale(1); }
      to { opacity: 0; transform: translateY(-10px) scale(0.95); }
    }
    
    .ripple {
      position: relative;
      overflow: hidden;
    }
    .ripple::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0;
      height: 0;
      background: rgba(94, 53, 177, 0.2);
      border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: width 0.4s ease, height 0.4s ease;
    }
    .ripple:active::after {
      width: 200%;
      height: 200%;
    }
    
    .camera-modal {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: #000;
      border-radius: 44px;
      z-index: 300;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: cameraIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    
    @keyframes cameraIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    
    .camera-viewfinder {
      position: relative;
      flex: 1;
      margin: 16px;
      border-radius: 24px;
      overflow: hidden;
      background: linear-gradient(180deg, #1a1a2e 0%, #0f0f1a 100%);
    }
    
    .camera-corner {
      position: absolute;
      width: 24px;
      height: 24px;
      border-color: rgba(255,255,255,0.6);
      border-style: solid;
      border-width: 0;
    }
    
    .camera-corner-tl {
      top: 16px;
      left: 16px;
      border-top-width: 3px;
      border-left-width: 3px;
      border-top-left-radius: 12px;
    }
    
    .camera-corner-tr {
      top: 16px;
      right: 16px;
      border-top-width: 3px;
      border-right-width: 3px;
      border-top-right-radius: 12px;
    }
    
    .camera-corner-bl {
      bottom: 16px;
      left: 16px;
      border-bottom-width: 3px;
      border-left-width: 3px;
      border-bottom-left-radius: 12px;
    }
    
    .camera-corner-br {
      bottom: 16px;
      right: 16px;
      border-bottom-width: 3px;
      border-right-width: 3px;
      border-bottom-right-radius: 12px;
    }
    
    .camera-shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #5E35B1;
      border: 4px solid rgba(94, 53, 177, 0.3);
      box-shadow: 0 0 0 4px rgba(94, 53, 177, 0.15);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    
    .camera-shutter:active {
      transform: scale(0.92);
    }
    
    .camera-tab {
      padding: 8px 12px;
      font-size: 14px;
      color: #9E9E9E;
      cursor: pointer;
      transition: color 0.2s ease;
      white-space: nowrap;
    }
    
    .camera-tab.active {
      color: #5E35B1;
      font-weight: 600;
    }
    
    .camera-bottom-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 8px;
    }
    
    .camera-bottom-btn:active {
      opacity: 0.7;
    }
    
    .expand-panel-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 240;
      animation: fadeIn 0.2s ease forwards;
    }
    
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    
    .expand-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1px solid rgba(167, 139, 250, 0.08);
      border-radius: 20px 20px 0 0;
      z-index: 250;
      padding: 20px 20px 32px;
      box-shadow: 0 -4px 24px rgba(0,0,0,0.06);
      animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    
    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }
    
    .expand-panel-close {
      animation: slideDown 0.25s ease forwards;
    }

    /* 知识库新建面板：预留全局 AI 对话框与安全区的可视空间 */
    .knowledge-add-overlay {
      bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    }

    .knowledge-add-sheet {
      bottom: calc(88px + env(safe-area-inset-bottom, 0px));
      z-index: 499;
      border-radius: 20px;
    }

    .knowledge-create-row {
      display: flex;
      justify-content: flex-start;
      min-height: 36px;
    }

    .knowledge-create-button {
      height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(94, 53, 177, 0.22);
      border-radius: 10px;
      background: #FAF8FF;
      box-shadow: 0 3px 8px rgba(94, 53, 177, 0.10);
      color: #5E35B1;
      font-size: 13px;
      font-weight: 600;
      line-height: 1;
      white-space: nowrap;
      transition: transform 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
    }

    .knowledge-create-button:hover { background: #F3EEFF; }
    .knowledge-create-button:active { transform: scale(0.97); box-shadow: 0 1px 4px rgba(94, 53, 177, 0.12); }
    
    @keyframes slideDown {
      from { transform: translateY(0); }
      to { transform: translateY(100%); }
    }
    
    .user-select-panel {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1px solid rgba(167, 139, 250, 0.08);
      border-radius: 20px 20px 0 0;
      z-index: 300;
      padding: 20px 20px 32px;
      animation: slideUp 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    
    .user-select-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.15s ease;
    }
    
    .user-select-item:active {
      background: #F5F5F5;
    }
    
    .user-select-item.selected {
      background: '#EDE7F6';
    }
    
    .expand-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }
    
    .expand-item:active {
      background: #F5F5F5;
    }
    
    .side-menu-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      z-index: 400;
      animation: fadeIn 0.2s ease forwards;
    }
    
    .side-menu {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 85%;
      max-width: 320px;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border-right: 1px solid rgba(255, 255, 255, 0.8);
      z-index: 410;
      border-radius: 0 32px 32px 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: slideInLeft 0.3s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      box-shadow: 
        4px 0 32px rgba(94, 53, 177, 0.12),
        8px 0 48px rgba(94, 53, 177, 0.08),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
    }
    
    @keyframes slideInLeft {
      from { transform: translateX(-100%); }
      to { transform: translateX(0); }
    }
    
    @keyframes slideOutLeft {
      from { transform: translateX(0); }
      to { transform: translateX(-100%); }
    }
    
    .side-menu-close {
      animation: slideOutLeft 0.25s ease forwards;
    }
    
    .side-menu-content {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      scrollbar-width: none;
    }
    .side-menu-content::-webkit-scrollbar { display: none; }
    
    .settings-bottom-sheet {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: #FFFFFF;
      border: 1px solid rgba(167, 139, 250, 0.08);
      border-radius: 20px 20px 44px 44px;
      z-index: 260;
      padding: 12px 20px 32px;

                img.src = event.target.result;

    );

    const MaintenanceFields = ({ record, completed }) => {
      const isAlert = record.sourceType === 'alert';
      const fields = isAlert ? [
        ['告警名称', record.alertName], ['告警等级', record.alertLevel], ['告警时间', record.alertTime],

        ['所属系统', record.systemName || record.systemId], ['告警内容', record.alertContent],

      const completedRecords = maintenanceRecords
        .filter(record => record.factoryId === selectedFactory?.id && record.systemId === currentSystem && record.status === 'completed')

      const records = activeTab === 'current' ? pendingRecords : completedRecords;
      const pageCount = Math.max(1, Math.ceil(records.length / pageSize));
      const requestedPage = activeTab === 'current' ? currentPage : historyPage;
      const safePage = Math.min(Math.max(requestedPage, 1), pageCount);
      const pageRecords = records.slice((safePage - 1) * pageSize, safePage * pageSize);

      useEffect(() => {
        if (activeTab === 'current' && currentPage !== safePage) setCurrentPage(safePage);

      }, [activeTab, currentPage, historyPage, safePage]);

      useEffect(() => { setActiveTab(viewState.tab); setCurrentPage(viewState.currentPage); setHistoryPage(viewState.historyPage); }, []);
      const saveView = (next) => setViewState(prev => ({...prev, tab: activeTab, currentPage, historyPage, ...next}));
      const switchTab = (tab) => { setActiveTab(tab); saveView({tab}); };
      const changePage = (nextPage) => {

        <div className="iphone-screen" style={{background: 'linear-gradient(135deg, #F7F4FF 0%, #FFFFFF 48%, #F6F2FF 100%)'}}>

              <select value={currentSystem} onChange={e => setCurrentSystem(e.target.value)} style={{width: '100%', border: '1px solid #DDD4F1', borderRadius: 10, padding: '9px 10px', color: '#4527A0', background: '#fff', fontSize: 13}}><option value="一号系统">一号系统</option><option value="二号系统">二号系统</option></select>
            </div>

            <div style={{display: 'flex', gap: 8, padding: 4, borderRadius: 15, background: '#EEEAF7', marginBottom: 16}}>
              {[['current', '当前维保提醒'], ['history', '历史维保记录']].map(([key, label]) => (
                <button key={key} className="clickable" onClick={() => switchTab(key)} style={{flex: 1, minWidth: 0, border: 'none', borderRadius: 11, padding: '10px 6px', fontSize: 13, fontWeight: 650, color: activeTab === key ? '#FFFFFF' : '#786C94', background: activeTab === key ? '#5E35B1' : 'transparent', boxShadow: activeTab === key ? '0 4px 10px rgba(94,53,177,.22)' : 'none', whiteSpace: 'nowrap'}}>{label}</button>
              ))}
            </div>

            {pageRecords.length === 0 ? (
              <div style={{padding: '46px 20px', textAlign: 'center', color: '#9E9E9E', fontSize: 14, background: 'rgba(255,255,255,.72)', borderRadius: 18}}>
                {activeTab === 'current' ? '暂无待处理维保提醒' : '暂无历史维保记录'}
              </div>
            ) : (
              <div style={{display: 'flex', flexDirection: 'column', gap: 12}}>
                {pageRecords.map(record => {
                  const completed = record.status === 'completed';
                  return <div key={record.id} className="glass-card-soft clickable" onClick={() => { saveView({}); onOpenDetail(record.id); }} style={{borderRadius: 18, padding: '15px', overflow: 'hidden'}}>
                    <div style={{display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 10, marginBottom: 11}}>
                      <div style={{minWidth: 0}}>

                        <div style={{fontSize: 12, color: '#757575', marginTop: 4, letterSpacing: '.2px', overflowWrap: 'anywhere'}}>{record.deviceCode}</div>
                      </div>
                      <span style={{flexShrink: 0, borderRadius: 999, padding: '4px 9px', fontSize: 12, fontWeight: 650, color: completed ? '#2E7D32' : '#C65B12', background: completed ? '#E8F5E9' : '#FFF0E3'}}>{completed ? '已完成' : '待办'}</span>

                    <div style={{fontSize: 13, lineHeight: '20px', color: '#424242', overflowWrap: 'anywhere', marginBottom: 9}}>{record.maintenanceContent}</div>
                    <div style={{fontSize: 12, color: '#757575', lineHeight: '19px'}}>{completed ? '原计划维保时间' : '维保时间'}：{formatTime(record.scheduledTime)}</div>
                    {completed && <><div style={{fontSize: 12, color: '#2E7D32', lineHeight: '19px'}}>实际处理时间：{formatTime(record.completedTime)}</div><div style={{fontSize: 12, color: '#757575'}}>处理人：{record.handlerName}</div></>}
                    {!completed && <div style={{display: 'flex', justifyContent: 'flex-end', marginTop: 12}}><button className="clickable" onClick={event => { event.stopPropagation(); saveView({}); onOpenForm(record.id, 'maintenanceManager'); }} style={{border: 'none', borderRadius: 10, padding: '8px 16px', background: '#5E35B1', color: '#fff', fontSize: 13, fontWeight: 650, boxShadow: '0 3px 8px rgba(94,53,177,.22)'}}>处理</button></div>}
                  </div>;

            {records.length > 0 && <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 12, marginTop: 18}}>
              <button className="clickable" disabled={safePage === 1} onClick={() => changePage(safePage - 1)} style={{border: 'none', borderRadius: 9, padding: '8px 12px', background: safePage === 1 ? '#ECEAF0' : '#EEE7FA', color: safePage === 1 ? '#B0ABB9' : '#5E35B1', fontSize: 13}}>上一页</button>
              <span style={{fontSize: 13, color: '#5E35B1', fontWeight: 650, minWidth: 42, textAlign: 'center'}}>{safePage} / {pageCount}</span>
              <button className="clickable" disabled={safePage === pageCount} onClick={() => changePage(safePage + 1)} style={{border: 'none', borderRadius: 9, padding: '8px 12px', background: safePage === pageCount ? '#ECEAF0' : '#EEE7FA', color: safePage === pageCount ? '#B0ABB9' : '#5E35B1', fontSize: 13}}>下一页</button>
            </div>}
          </div>
        </div>

    const MaintenanceDetailPage = ({ record, onBack, onProcess }) => {

    };

    const MaintenanceFormPage = ({ record, handlerName, onCancel, onSubmit, onToast }) => {
      const [description, setDescription] = useState(''); const [images, setImages] = useState([]); const [falseAlarm, setFalseAlarm] = useState(false); const [addCase, setAddCase] = useState(false); const [submitting, setSubmitting] = useState(false); const inputRef = React.useRef(null);
      const openedTime = React.useMemo(() => { const date = new Date(); return `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')} ${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`; }, []);
      const dirty = description || images.length || falseAlarm || addCase;
      const leave = () => { if (!dirty || window.confirm('已有填写内容，确认放弃本次处理吗？')) onCancel(); };
      const upload = event => { const files = Array.from(event.target.files || []).filter(file => /image\/(jpeg|png|webp)/.test(file.type)); setImages(prev => [...prev, ...files.map(file => ({name: file.name, url: URL.createObjectURL(file)}))]); event.target.value = ''; };
      const submit = () => { if (!description.trim()) { onToast('请填写处置描述'); return; } setSubmitting(true); onSubmit({ handlerName, completedTime: openedTime, dispositionDescription: description.trim(), images, isFalseAlarm: falseAlarm, addToCaseLibrary: addCase }); };
      const isAlert = record?.sourceType === 'alert';
      return <div className="iphone-screen" style={{background: '#F8F6FC', overflowX: 'hidden'}}><MaintenanceHeader title={isAlert ? '告警处理单' : '预警处理单'} onBack={leave} />
        <div className="content-scroll" style={{padding: '16px 16px calc(230px + env(safe-area-inset-bottom, 0px))', overflowX: 'hidden'}}>{record && <><div className="glass-card-soft" style={{padding: 16, borderRadius: 18, marginBottom: 14, minWidth: 0}}><div style={{fontWeight: 700, marginBottom: 12}}>{isAlert ? '告警信息' : '预警信息'}</div><MaintenanceFields record={record} /></div><div className="glass-card-soft" style={{padding: 16, borderRadius: 18, minWidth: 0}}><div style={{fontWeight: 700, marginBottom: 12}}>处理信息</div><div style={{display: 'grid', gap: 12, fontSize: 13, minWidth: 0}}><label>处理人<input readOnly value={handlerName} style={{boxSizing: 'border-box', width: '100%', marginTop: 5, padding: 10, border: '1px solid #DDD4F1', borderRadius: 10, background: '#F6F3FB'}} /></label><label>处理时间<input readOnly value={openedTime} style={{boxSizing: 'border-box', width: '100%', marginTop: 5, padding: 10, border: '1px solid #DDD4F1', borderRadius: 10, background: '#F6F3FB'}} /></label><label>处置描述<textarea value={description} onChange={event => setDescription(event.target.value)} placeholder="请填写实际处置过程和结果" style={{boxSizing: 'border-box', width: '100%', minHeight: 90, marginTop: 5, padding: 10, resize: 'vertical', border: '1px solid #CFC3E8', borderRadius: 10}} /></label><div><span>上传图片</span><input ref={inputRef} type="file" accept="image/jpeg,image/png,image/webp" multiple className="hidden" onChange={upload} /><button type="button" className="clickable" onClick={() => inputRef.current?.click()} style={{display: 'block', marginTop: 7, padding: '8px 12px', border: '1px dashed #8D70C8', borderRadius: 9, background: '#F5F0FF', color: '#5E35B1'}}>选择图片</button>{images.length > 0 && <div style={{display: 'flex', flexWrap: 'wrap', gap: 8, marginTop: 9}}>{images.map((image, index) => <div key={image.url} style={{position: 'relative', maxWidth: '100%'}}><img onClick={() => window.open(image.url, '_blank')} src={image.url} alt={image.name} style={{width: 64, height: 64, maxWidth: '100%', objectFit: 'cover', borderRadius: 8, cursor: 'pointer'}} /><button type="button" aria-label="删除图片" onClick={() => setImages(prev => prev.filter((_, itemIndex) => itemIndex !== index))} style={{position: 'absolute', right: -5, top: -6, border: 'none', borderRadius: '50%', background: '#E53935', color: '#fff', width: 18, height: 18, lineHeight: '16px'}}>×</button></div>)}</div>}</div>{[['是否误录', falseAlarm, setFalseAlarm], ['是否录入案例库', addCase, setAddCase]].map(([label, value, setValue]) => <div key={label} style={{display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: '7px 12px'}}><span>{label}</span><div style={{display: 'inline-flex', flexWrap: 'wrap', gap: 15}}>{[[false, '否'], [true, '是']].map(([option, text]) => <label key={text} style={{whiteSpace: 'nowrap'}}><input type="radio" checked={value === option} onChange={() => setValue(option)} /> {text}</label>)}</div></div>)}</div><div style={{display: 'flex', gap: 10, marginTop: 18, flexWrap: 'wrap'}}><button className="clickable" onClick={leave} disabled={submitting} style={{flex: '1 1 110px', padding: 12, border: 'none', borderRadius: 10, background: '#EEEAF4', color: '#655B75'}}>取消</button><button className="clickable" onClick={submit} disabled={submitting} style={{flex: '1 1 110px', padding: 12, border: 'none', borderRadius: 10, background: submitting ? '#B9A8DC' : '#5E35B1', color: '#fff'}}>{submitting ? '提交中...' : '提交处理'}</button></div></div></>}</div></div>;
    };

    const CaseLibraryPage = ({ records, factoryList, currentUser, setCurrentUser, currentSystem, setCurrentSystem, onBack, onOpen }) => {
      const [page, setPage] = useState(1); const selectedFactory = factoryList.find(factory => factory.name === currentUser) || factoryList[0]; const list = records.filter(record => record.status === 'completed' && record.addToCaseLibrary && record.factoryId === selectedFactory?.id && record.systemId === currentSystem).sort((a,b) => new Date(b.completedTime) - new Date(a.completedTime)); const pages = Math.max(1, Math.ceil(list.length / 4)); const safePage = Math.min(page, pages); const shown = list.slice((safePage-1)*4, safePage*4);

            </svg>

    const DeviceListPage = ({ onNavigate, onToast, devices, onSelectDevice, filters, onFiltersChange }) => {

      const typeFilter = filters.type;
      const controlModeFilter = filters.controlMode;
      const statusFilter = filters.status;
      const setFilter = (key, value) => onFiltersChange(previous => ({ ...previous, [key]: value }));
      
      const handleRefresh = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        setUpdateTime(`${hours}:${minutes}`);
        onToast(`数据已更新至 ${updateTime}`);
      };
      
      const deviceTypes = ['全部', '过滤设备', '泵类设备', '消毒设备', '监测设备', '养殖设备', '供氧设备', '温控设备', '投喂设备', '水处理设备'];
      
      // 筛选 + 故障设备排最前
      const filteredDevices = devices
        .filter(d => typeFilter === '全部' || d.type === typeFilter)
        .filter(d => controlModeFilter === 'all' || getDeviceControlMode(d) === controlModeFilter)
        .filter(d => statusFilter === 'all' || d.status === statusFilter)
        .sort((a, b) => {
          if (a.status === 'fault' && b.status !== 'fault') return -1;
          if (a.status !== 'fault' && b.status === 'fault') return 1;
          if (a.status === 'stopped' && b.status === 'running') return 1;
          if (a.status === 'running' && b.status === 'stopped') return -1;
          return 0;
        });
      
      const runningCount = devices.filter(d => typeFilter === '全部' || d.type === typeFilter).filter(d => d.status === 'running').length;
      const stoppedCount = devices.filter(d => typeFilter === '全部' || d.type === typeFilter).filter(d => d.status === 'stopped').length;
      const faultCount = devices.filter(d => typeFilter === '全部' || d.type === typeFilter).filter(d => d.status === 'fault').length;
      const totalCount = devices.filter(d => typeFilter === '全部' || d.type === typeFilter).length;
      
      const statusConfig = {
        running: { label: '运行', color: '#4CAF50' },
        stopped: { label: '停止', color: '#9E9E9E' },
        fault: { label: '故障', color: '#E53935' }

      return (

          </div>
          
          {/* 设备类型与操控方式组合筛选 */}

            <div className="device-filter-grid">
              <div className="device-filter-control"><select className="device-filter-select" aria-label="设备类型" value={typeFilter} onChange={event => setFilter('type', event.target.value)}>{deviceTypes.map(type => <option key={type} value={type}>{`类型：${type}`}</option>)}</select><svg className="device-filter-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
              <div className="device-filter-control"><select className="device-filter-select" aria-label="操控方式" value={controlModeFilter} onChange={event => setFilter('controlMode', event.target.value)}><option value="all">操控方式：全部方式</option><option value="local">操控方式：本地</option><option value="remote">操控方式：远程</option></select><svg className="device-filter-chevron" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg></div>
            </div>
          </div>
          
          {/* Stats Card */}
          <div className="device-stats-card">
            <div className="device-stats-head">
              <span style={{fontSize: 13, fontWeight: 500, color: '#666'}}>设备运行状态</span>
              <div className="flex items-center gap-2">
                <span style={{fontSize: 11, color: '#999'}}>更新于{updateTime}</span>
                <button className="clickable p-1" onClick={handleRefresh}>
                  <RefreshIcon />
                </button>
              </div>
            </div>
            <div className="device-stats-content">
              <div className="device-stats-total"><strong>{statusFilter === 'all' ? runningCount : filteredDevices.length}</strong><span>/ {totalCount} 台</span></div>
              <div className="device-status-list">
                {[['running','运行',runningCount,'#4CAF50'],['stopped','停止',stoppedCount,'#9E9E9E'],['fault','故障',faultCount,'#E53935']].map(([key,label,count,color]) => <button type="button" key={key} className={`device-status-filter clickable ${statusFilter===key?'active':''}`} onClick={() => setFilter('status', statusFilter === key ? 'all' : key)}><i className="device-status-dot" style={{background:color}}/><span>{label}</span><strong>{count}</strong></button>)}
              </div>
            </div>
              {(typeFilter !== '全部' || controlModeFilter !== 'all' || statusFilter !== 'all') && (
                <div className="mt-3 text-center">
                  <button 
                    className="clickable text-xs text-gray-500 hover:text-gray-700"
                    onClick={() => onFiltersChange({ type: '全部', controlMode: 'all', status: 'all' })}
                  >
                    查看全部设备
                  </button>
                </div>
              )}
            </div>
          
          <div className="content-scroll device-list-scroll">
            <div className="flex flex-col gap-3">
              {filteredDevices.map((device) => {
                const status = statusConfig[device.status];
                return (
                  <div
                    key={device.id}
                    className="device-list-card clickable"
                    onClick={() => onSelectDevice(device.id)}
                  >
                    <div className="device-list-card-inner">
                      <div className="device-list-icon"><DeviceListIcon type={device.type}/></div>
                      <div className="device-card-main">
                        <div className="device-card-title-row"><div className="device-card-name">{device.name}</div>{device.status === 'fault' && <span className="device-repair-label">需维修</span>}</div>
                        <div className="device-card-meta">设备编号：{String(device.id).padStart(4, '0')}</div>
                        <div className="device-card-meta">{device.location} · {device.type}</div>
                        <div className="device-card-tags"><span className="device-card-tag mode">{getDeviceControlModeLabel(device)}控</span><span className="device-card-tag"><i className="device-status-dot" style={{background:status.color}}/>{status.label}</span></div>
                      </div>
                    </div>
                  </div>
                );
              })}
              {filteredDevices.length === 0 && (

              )}
            </div>
            
            <div style={{height: 40}}></div>
          </div>
          
          <div className="iphone-home-indicator"></div>
        </div>
      );
    };
    
    const DeviceDetailPage = ({ onNavigate, onToast, device, onUpdateStatus }) => {
      const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', action: null });
      const [monitorData, setMonitorData] = useState({
        current: 12.5,
        voltage: 380,
        temperature: 45.2,
        frequency: 50.0,
        pressure: 0.35
      });
      const getCurrentTime = () => {
        const now = new Date();
        const hours = String(now.getHours()).padStart(2, '0');
        const minutes = String(now.getMinutes()).padStart(2, '0');
        return `${hours}:${minutes}`;
      };
      const [updateTime, setUpdateTime] = useState(getCurrentTime);
      const [refreshing, setRefreshing] = useState(false);
      
      const isRunning = device?.status === 'running';
      const isFault = device?.status === 'fault';
      const isRemote = getDeviceControlMode(device) === 'remote';

      useEffect(() => {
        setConfirmDialog({ open: false, title: '', message: '', action: null });
        setMonitorData({ current: 12.5, voltage: 380, temperature: 45.2, frequency: 50.0, pressure: 0.35 });
        setUpdateTime(getCurrentTime());
        setRefreshing(false);
      }, [device?.id]);
      
      const handleToggle = () => {
        if (!device || getDeviceControlMode(device) !== 'remote') {
          onToast('本地操控模式下不可远程修改');
          return;
        }
        if (isFault) {
          onToast('故障设备无法启动，请先维修');
          return;
        }
        const newStatus = isRunning ? 'stopped' : 'running';
        setConfirmDialog({
          open: true,
          title: isRunning ? '确认停止设备？' : '确认启动设备？',
          message: isRunning ? `确定要停止${device?.name}吗？停止后将影响相关系统运行。` : `确定要启动${device?.name}吗？`,
          action: () => {
            if (getDeviceControlMode(device) !== 'remote') {
              onToast('本地操控模式下不可远程修改');
              return;
            }
            onUpdateStatus(newStatus);
            onToast(isRunning ? '设备已停止' : '设备已启动');
          }
        });
      };

      const handleRefresh = () => {
        const nextTime = getCurrentTime();
        setRefreshing(true);
        setUpdateTime(nextTime);
        onToast(`数据已更新至 ${nextTime}`);
        setTimeout(() => setRefreshing(false), 220);
      };
      
      return (
        <div className="page-enter flex flex-col h-full" style={{background: '#F5F5F7'}}>
          <StatusBar />
          
          {/* Header */}
          <div className="flex items-center justify-between px-4" style={{height: 56}}>

              <BackIcon />

            <div style={{width: 40}}></div>
          </div>

            {/* Device Info Card */}
            <div className="bg-white mb-4" style={{borderRadius: 16, padding: 20, boxShadow: '0 2px 8px rgba(0,0,0,0.04)'}}>
              <div className="flex items-center gap-3 mb-4">
                <div
                  className="w-14 h-14 rounded-xl flex items-center justify-center flex-shrink-0"
                  style={{background: isFault ? '#FFEBEE' : '#EDE7F6', fontSize: 28}}
                >
                  {device?.icon || '⚙️'}
                </div>
                <div style={{minWidth: 0, flex: 1}}>
                  <div style={{fontSize: 18, fontWeight: 600, color: '#212121', overflowWrap: 'anywhere'}}>{device?.name || '设备'}</div>
                  <div style={{fontSize: 12, color: '#757575', marginTop: 3}}>设备编号：{device ? String(device.id).padStart(4, '0') : '----'}</div>

                      className="px-2 py-0.5 rounded-full"
                      style={{
                        fontSize: 12,
                        fontWeight: 500,
                        color: isRunning ? '#4CAF50' : (isFault ? '#E53935' : '#9E9E9E'),
                        background: isRunning ? '#E8F5E9' : (isFault ? '#FFEBEE' : '#F5F5F5')

                      操控方式：{getDeviceControlModeLabel(device)}
                    </span>
                    <span style={{fontSize: 12, color: '#9E9E9E'}}>{device?.location || '未知位置'}</span>
                  </div>

              </div>

              {!isRemote && (
                <div style={{marginBottom: 12, padding: '10px 12px', borderRadius: 10, background: '#F1F4F6', border: '1px solid #D7E0E5', color: '#546E7A', fontSize: 13, lineHeight: '19px', overflowWrap: 'anywhere'}}>
                  当前设备为本地操控模式，仅支持查看，请前往设备现场操作。
                </div>

              {/* Control Button */}

                  className={`w-full py-3 rounded-xl ${!isRemote ? 'device-control-disabled' : ''}`}

                    background: !isRemote ? '#ECEFF1' : (isRunning ? '#FFEBEE' : (isFault ? '#F5F5F5' : '#E8F5E9')),
                    color: !isRemote ? '#607D8B' : (isRunning ? '#E53935' : (isFault ? '#BDBDBD' : '#4CAF50')),
                    fontSize: 16,
                    fontWeight: 600,
                    border: 'none',
                    cursor: (!isRemote || isFault) ? 'not-allowed' : 'pointer',
                    opacity: isFault && isRemote ? 0.6 : 1,
                    pointerEvents: !isRemote ? 'none' : 'auto'
                  }}
                  disabled={!isRemote || isFault}
                  aria-disabled={!isRemote || isFault}
                  onClick={handleToggle}
                >
                  {!isRemote ? '本地操控，仅支持查看' : (isRunning ? '停止设备' : (isFault ? '设备故障' : '启动设备'))}
                </button>
              </div>
            </div>
            
            {/* IOT Monitor Data */}

                  <span style={{fontSize: 12, color: '#9E9E9E', whiteSpace: 'nowrap'}}>更新时间 {updateTime}</span>
                  <button
                    className="clickable p-1"
                    style={{border: 'none', background: 'transparent', cursor: 'pointer'}}

                      <RefreshIcon />
                    </div>
                  </button>

              </div>
              
              <div style={{display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12}}>

                  { label: '频率', value: monitorData.frequency, unit: 'Hz', color: '#4527A0' },
                  { label: '压力', value: monitorData.pressure, unit: 'MPa', color: '#9575CD' },

                    className="p-3"
                    style={{background: '#F8F6FB', borderRadius: 12}}
                  >

                      <div style={{marginTop: 12, background: '#F8F5FF', borderRadius: 14, padding: 14, border: '1px solid rgba(94, 53, 177, 0.08)'}}>
                        <div style={{display: 'grid', gridTemplateColumns: 'repeat(2, minmax(0, 1fr))', gap: 10, marginBottom: 12}}>
                          <div>
                            <div style={{fontSize: 11, color: '#9E9E9E', marginBottom: 4}}>日志类型</div>
                            <div style={{fontSize: 13, fontWeight: 600, color: '#212121'}}>{log.type}</div>
                          </div>
                          <div>
                            <div style={{fontSize: 11, color: '#9E9E9E', marginBottom: 4}}>执行结果</div>
                            <div style={{fontSize: 13, fontWeight: 600, color: log.result.includes('成功') || log.result.includes('启用') || log.result.includes('恢复') ? '#43A047' : '#5E35B1'}}>{log.result}</div>
                          </div>
                          <div>
                            <div style={{fontSize: 11, color: '#9E9E9E', marginBottom: 4}}>时间</div>
                            <div style={{fontSize: 13, fontWeight: 600, color: '#212121'}}>{log.time}</div>
                          </div>
                          <div>
                            <div style={{fontSize: 11, color: '#9E9E9E', marginBottom: 4}}>操作人</div>
                            <div style={{fontSize: 13, fontWeight: 600, color: '#212121'}}>{log.operator}</div>
                          </div>
                        </div>
                        <div style={{marginBottom: 10}}>
                          <div style={{fontSize: 11, color: '#9E9E9E', marginBottom: 4}}>业务对象</div>
                          <div style={{fontSize: 13, fontWeight: 600, color: '#212121'}}>{log.object}</div>
                        </div>
                        <div>
                          <div style={{fontSize: 11, color: '#9E9E9E', marginBottom: 4}}>详细说明</div>
                          <div style={{fontSize: 13, color: '#6E6893', lineHeight: '20px'}}>{log.detail}</div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>

            <div style={{height: 28}}></div>
          </div>

          <div className="iphone-home-indicator"></div>
        </div>
      );
    };
    
    const WaterQualityDetailPage = ({ onNavigate, onToast }) => {
      const [activeTab, setActiveTab] = useState('日');
      const [currentDate, setCurrentDate] = useState(new Date());
      const [detailOpen, setDetailOpen] = useState(false);
      const [selectedMetric, setSelectedMetric] = useState(null);
      const [activeCurves, setActiveCurves] = useState({
        level: true,
        oxygen: true,
        ph: true,
        temp: true
      });
      const [selectedCurve, setSelectedCurve] = useState('ph');
      const chartRef = React.useRef(null);
      const chartInstanceRef = React.useRef(null);
      const [hoveredIndex, setHoveredIndex] = useState(null);
      
      const tabs = ['日', '周'];
      
      const formatDate = (date, tab) => {
        if (tab === '日') {
          return `${date.getMonth() + 1}月${date.getDate()}日`;
        }
        return getWeekRange(date).label;
      };
      
      const getPeriodLabel = (tab) => {
        if (tab === '日') return '今日';
        return '本周';
      };
      
      const getAnalysisTitle = (tab) => {
        if (tab === '日') return '水质分析';
        return '水质趋势';
      };
      
      // Calculate monitoring duration
      const calcDuration = (start, end) => {
        const [sh, sm] = start.split(':').map(Number);
        const [eh, em] = end.split(':').map(Number);
        let startMin = sh * 60 + sm;
        let endMin = eh * 60 + em;
        if (endMin < startMin) endMin += 24 * 60;
        const diff = endMin - startMin;
        const hours = Math.floor(diff / 60);
        const mins = diff % 60;
        return { hours, mins };
      };

      const getWeekRange = (date) => {
        const start = new Date(date);
        const day = start.getDay() || 7;
        start.setDate(start.getDate() - day + 1);
        const end = new Date(start);
        end.setDate(start.getDate() + 6);
        const format = (d) => `${d.getMonth() + 1}月${d.getDate()}日`;
        const short = (d) => `${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        return {
          label: `${format(start)}-${format(end)}`,
          start: short(start),
          end: short(end)
        };
      };

      const handlePeriodChange = (step) => {
        setCurrentDate(prev => {
          const next = new Date(prev);
          next.setDate(next.getDate() + (activeTab === '日' ? step : step * 7));
          return next;
        });
      };

      const getQualityStatus = (rate) => {
        if (rate >= 90) return { label: '优秀', color: '#4CAF50' };
        if (rate >= 80) return { label: '良好', color: '#5E35B1' };
        if (rate >= 70) return { label: '一般', color: '#FB8C00' };
        return { label: '较差', color: '#E53935' };
      };

      const withinThreshold = (value, range) => value >= range[0] && value <= range[1];

      const makeTimeSamples = () => {
        const start = 8 * 60 + 30;
        return Array.from({ length: 49 }, (_, idx) => {
          const minutes = start + idx * 10;
          const hour = Math.floor(minutes / 60);
          const minute = minutes % 60;
          const wave = Math.sin(idx / 5);
          const wave2 = Math.cos(idx / 7);
          return {
            time: `${String(hour).padStart(2, '0')}:${String(minute).padStart(2, '0')}`,
            level: Number((124 + wave * 5 + wave2 * 2).toFixed(1)),
            oxygen: Number((10.1 + wave * 0.35 - wave2 * 0.18).toFixed(2)),
            ph: Number((7.24 + wave * 0.18 + wave2 * 0.08).toFixed(2)),
            temp: Number((26 + wave * 1.1 + idx * 0.01).toFixed(1)),
          };
        });
      };

      const makeQualityRows = (samples, descriptions) => {
        const configs = [
          { label: '液位', key: 'level', unit: 'mm', color: '#5E35B1', threshold: [100, 200] },
          { label: '溶氧', key: 'oxygen', unit: 'mol/L', color: '#7E57C2', threshold: [8, 12] },
          { label: 'PH值', key: 'ph', unit: '', color: '#4527A0', threshold: [6.5, 8.5] },
          { label: '温度', key: 'temp', unit: '°C', color: '#9575CD', threshold: [20, 30] },
        ];
        return configs.map((config) => {
          const values = samples.map(item => item[config.key]);
          const avg = values.reduce((sum, value) => sum + value, 0) / values.length;
          const percent = Math.round(values.filter(value => withinThreshold(value, config.threshold)).length / values.length * 100);
          const status = getQualityStatus(percent);
          const value = config.key === 'level' ? Math.round(avg) : avg.toFixed(config.key === 'temp' ? 1 : 2).replace(/\.00$/, '');
          return {
            ...config,
            value,
            percent,
            status: status.label,
            statusColor: status.color,
            thresholdText: `${config.threshold[0]}-${config.threshold[1]}${config.unit}`,
            desc: descriptions[config.key],
            detailValue: `平均${config.label}为${value}${config.unit}`,
            detailPercent: `达标率${percent}%`
          };
        });
      };

      const makeStats = (samples) => {
        return ['level', 'oxygen', 'ph', 'temp'].reduce((acc, key) => {
          const metric = samples.reduce((result, item) => {
            if (!result.max || item[key] > result.max.value) result.max = { value: item[key], time: item.time };
            if (!result.min || item[key] < result.min.value) result.min = { value: item[key], time: item.time };
            result.total += item[key];
            return result;
          }, { max: null, min: null, total: 0 });
          const config = {
            level: { unit: 'mm', precision: 0 },
            oxygen: { unit: 'mol/L', precision: 2 },
            ph: { unit: 'PH', precision: 2 },
            temp: { unit: '°C', precision: 1 },
          }[key];
          const formatValue = (value) => config.precision === 0 ? String(Math.round(value)) : Number(value).toFixed(config.precision).replace(/\.00$/, '');
          acc[key] = {
            max: { value: formatValue(metric.max.value), unit: config.unit, time: metric.max.time },
            min: { value: formatValue(metric.min.value), unit: config.unit, time: metric.min.time },
            avg: { value: formatValue(metric.total / samples.length), unit: config.unit, time: activeTab === '日' ? '全日' : '本周' }
          };
          return acc;
        }, {});
      };

      const dailySamples = makeTimeSamples();
      const weeklySamples = [
        { time: '周一', level: 118, oxygen: 9.5, ph: 7.02, temp: 25.0 },
        { time: '周二', level: 121, oxygen: 9.8, ph: 7.12, temp: 25.5 },
        { time: '周三', level: 124, oxygen: 10.3, ph: 7.32, temp: 26.5 },
        { time: '周四', level: 123, oxygen: 10.2, ph: 7.22, temp: 26.2 },
        { time: '周五', level: 126, oxygen: 10.1, ph: 7.18, temp: 26.6 },
        { time: '周六', level: 128, oxygen: 9.9, ph: 7.08, temp: 27.0 },
        { time: '周日', level: 122, oxygen: 10.0, ph: 7.20, temp: 26.1 },
      ];

      const descriptions = {
        level: '液位按100-200mm阈值区间计算，系统每10分钟采集一次，区间内采样点占总采样点的比例即为达标率。',
        oxygen: '溶氧量按8-12mol/L阈值区间计算，达标率反映当前供氧与水体稳定性。',
        ph: 'PH值按6.5-8.5阈值区间计算，酸碱度稳定有助于保护设备和管道。',
        temp: '温度按20-30°C阈值区间计算，过高或过低都会影响水处理效率。'
      };
      
      // Mock data for different tabs
      const data = {
        '日': {
          score: Math.round(makeQualityRows(dailySamples, descriptions).reduce((sum, item) => sum + item.percent, 0) / 4),
          scoreLabel: getQualityStatus(Math.round(makeQualityRows(dailySamples, descriptions).reduce((sum, item) => sum + item.percent, 0) / 4)).label,
          monitorStart: '08:30',
          monitorEnd: '16:30',
          chartData: makeQualityRows(dailySamples, descriptions),
          barData: dailySamples,
          stats: makeStats(dailySamples)
        },
        '周': {
          score: Math.round(makeQualityRows(weeklySamples, descriptions).reduce((sum, item) => sum + item.percent, 0) / 4),
          scoreLabel: getQualityStatus(Math.round(makeQualityRows(weeklySamples, descriptions).reduce((sum, item) => sum + item.percent, 0) / 4)).label,
          monitorStart: getWeekRange(currentDate).start,
          monitorEnd: getWeekRange(currentDate).end,
          chartData: makeQualityRows(weeklySamples, descriptions),
          barData: weeklySamples,
          stats: makeStats(weeklySamples)
        },
      };
      
      const currentData = data[activeTab];
      
      const displayStart = currentData.monitorStart;
      const displayEnd = currentData.monitorEnd;
      
      const duration = activeTab === '日' 
        ? calcDuration(currentData.monitorStart, currentData.monitorEnd)
        : null;
      
      const handleOpenDetail = (metric) => {
        setSelectedMetric(metric);
        setDetailOpen(true);
      };
      
      const handleToggleCurve = (key) => {
        setActiveCurves(prev => ({ ...prev, [key]: !prev[key] }));
        setSelectedCurve(key);
      };
      
      // Line chart data normalization
      const chartMetrics = [
        { key: 'level', label: '液位', unit: 'mm', color: '#5E35B1', min: 100, max: 200 },
        { key: 'oxygen', label: '溶氧', unit: 'mol/L', color: '#7E57C2', min: 8, max: 12 },
        { key: 'ph', label: 'PH值', unit: '', color: '#4527A0', min: 6.5, max: 8.5 },
        { key: 'temp', label: '温度', unit: '°C', color: '#9575CD', min: 20, max: 30 },
      ];
      
      const chartWidth = activeTab === '日' ? Math.max(760, currentData.barData.length * 22) : 340;
      const chartHeight = 160;
      const chartPadding = { top: 12, right: 46, bottom: 28, left: 8 };
      const plotWidth = chartWidth - chartPadding.left - chartPadding.right;
      const plotHeight = chartHeight - chartPadding.top - chartPadding.bottom;
      
      const getPoint = (index, value, min, max) => {
        const x = chartPadding.left + (index / (currentData.barData.length - 1)) * plotWidth;
        const y = chartPadding.top + plotHeight - ((value - min) / (max - min)) * plotHeight;
        return { x, y };
      };
      
      const buildPath = (key, min, max) => {
        const points = currentData.barData.map((d, i) => getPoint(i, d[key], min, max));
        return points.map((p, i) => `${i === 0 ? 'M' : 'L'} ${p.x} ${p.y}`).join(' ');
      };
      
      const currentStats = currentData.stats[selectedCurve];
      const curveNames = { level: '液位', oxygen: '溶氧', ph: 'PH值', temp: '温度' };
      const selectedChartMetric = chartMetrics.find(item => item.key === selectedCurve) || chartMetrics[0];
      const hoveredSample = activeTab === '日' && hoveredIndex !== null ? currentData.barData[hoveredIndex] : null;

      React.useEffect(() => {
        if (activeTab !== '日' || !chartRef.current || !window.echarts) return;

        const echartsInstance = chartInstanceRef.current || window.echarts.init(chartRef.current, null, { renderer: 'canvas' });
        chartInstanceRef.current = echartsInstance;

        const formatMetricValue = (metric, value) => {
          if (metric.key === 'level') return `${Math.round(value)}${metric.unit}`;
          if (metric.key === 'temp') return `${Number(value).toFixed(1)}${metric.unit}`;
          if (metric.key === 'ph') return `${Number(value).toFixed(2)}`;
          return `${Number(value).toFixed(2)}${metric.unit}`;
        };

        const metricExtents = chartMetrics.reduce((acc, metric) => {
          const values = currentData.barData.map(item => item[metric.key]);
          const minValue = Math.min(...values);
          const maxValue = Math.max(...values);
          const padding = Math.max((maxValue - minValue) * 0.18, metric.key === 'ph' ? 0.12 : 0.4);
          acc[metric.key] = {
            min: Number((minValue - padding).toFixed(metric.key === 'level' ? 0 : 2)),
            max: Number((maxValue + padding).toFixed(metric.key === 'level' ? 0 : 2))
          };
          return acc;
        }, {});

        const tooltipFormatter = (params) => {
          const points = Array.isArray(params) ? params : [params];
          if (!points.length) return '';
          const rowBySeries = points.reduce((acc, item) => {
            acc[item.seriesName] = item;
            return acc;
          }, {});
          const currentTime = points[0].axisValue;
          const rows = chartMetrics
            .filter(metric => activeCurves[metric.key] && rowBySeries[metric.label])
            .map(metric => {
              const point = rowBySeries[metric.label];
              return `
                <tr>
                  <td style="padding:4px 12px 4px 0; color:#757575; white-space:nowrap;">
                    <span style="display:inline-block; width:8px; height:8px; border-radius:999px; background:${metric.color}; margin-right:6px;"></span>${metric.label}
                  </td>
                  <td style="padding:4px 0; text-align:right; color:#212121; font-weight:600; white-space:nowrap;">${formatMetricValue(metric, point.data)}</td>
                </tr>
              `;
            })
            .join('');
          return `
            <div style="min-width:168px; padding:2px 2px 0;">
              <div style="font-size:12px; color:#8E8AA8; margin-bottom:6px;">时间 ${currentTime}</div>
              <table style="width:100%; border-collapse:collapse; font-size:12px;">
                ${rows}
              </table>
            </div>
          `;
        };

        const option = {
          animation: true,
          grid: { top: 20, right: 52, bottom: 26, left: 12 },
          tooltip: {
            trigger: 'axis',
            axisPointer: {
              type: 'cross',
              snap: true,
              lineStyle: { type: 'dashed', color: '#B39DDB', width: 1 },
              crossStyle: { type: 'dashed', color: '#B39DDB', width: 1 },
              label: {
                show: true,
                backgroundColor: '#5E35B1',
                borderRadius: 8,
                padding: [4, 6],
                color: '#fff'
              }
            },
            backgroundColor: 'rgba(255,255,255,0.98)',
            borderColor: 'rgba(94, 53, 177, 0.14)',
            borderWidth: 1,
            textStyle: { color: '#212121' },
            extraCssText: 'box-shadow: 0 8px 24px rgba(94,53,177,0.12); border-radius: 14px;',
            padding: 10,
            renderMode: 'html',
            confine: true,
            formatter: tooltipFormatter
          },
          axisPointer: {
            link: [{ xAxisIndex: 'all' }]
          },
          xAxis: {
            type: 'category',
            boundaryGap: false,
            data: currentData.barData.map(item => item.time),
            axisLine: { lineStyle: { color: '#E0E0E0' } },
            axisTick: { show: false },
            axisLabel: {
              color: '#9E9E9E',
              fontSize: 10,
              interval: 5
            }
          },
          yAxis: chartMetrics.map((metric, idx) => ({
            type: 'value',
            min: metricExtents[metric.key].min,
            max: metricExtents[metric.key].max,
            position: idx % 2 === 0 ? 'left' : 'right',
            offset: idx > 1 ? 32 : 0,
            show: selectedCurve === metric.key,
            axisLine: { show: false },
            axisTick: { show: false },
            splitLine: {
              show: selectedCurve === metric.key,
              lineStyle: { color: '#E0E0E0', type: 'dashed', width: 1 }
            },
            axisLabel: {
              color: '#9E9E9E',
              fontSize: 10,
              formatter: (value) => {
                if (metric.key === 'level' || metric.key === 'temp') return `${Math.round(value)}${metric.unit}`;
                if (metric.key === 'ph') return Number(value).toFixed(1);
                return `${Number(value).toFixed(1)}${metric.unit}`;
              }
            }
          })),
          series: chartMetrics
            .filter(metric => activeCurves[metric.key])
            .map(metric => ({
              name: metric.label,
              type: 'line',
              yAxisIndex: chartMetrics.findIndex(item => item.key === metric.key),
              data: currentData.barData.map(item => item[metric.key]),
              showSymbol: false,
              smooth: true,
              symbol: 'circle',
              symbolSize: selectedCurve === metric.key ? 8 : 6,
              lineStyle: {
                width: selectedCurve === metric.key ? 3 : 2,
                color: metric.color,
                opacity: selectedCurve === metric.key ? 1 : 0.36
              },
              itemStyle: {
                color: metric.color,
                borderColor: '#fff',
                borderWidth: 2,
                opacity: selectedCurve === metric.key ? 1 : 0.58
              },
              emphasis: {
                focus: 'series',
                scale: true,
                lineStyle: { width: 4, opacity: 1 },
                itemStyle: {
                  opacity: 1,
                  shadowBlur: 12,
                  shadowColor: `${metric.color}66`
                }
              }
            }))
        };

        echartsInstance.setOption(option, true);
        echartsInstance.resize();

        const handleAxisPointer = (event) => {
          const axisInfo = event.axesInfo && event.axesInfo[0];
          if (!axisInfo || typeof axisInfo.value !== 'number') return;
          setHoveredIndex(axisInfo.value);
        };
        const handleGlobalOut = () => setHoveredIndex(null);

        echartsInstance.off('updateAxisPointer');
        echartsInstance.off('globalout');
        echartsInstance.on('updateAxisPointer', handleAxisPointer);
        echartsInstance.on('globalout', handleGlobalOut);

        const handleResize = () => echartsInstance.resize();
        window.addEventListener('resize', handleResize);

        return () => {
          window.removeEventListener('resize', handleResize);
          if (chartInstanceRef.current) {
            chartInstanceRef.current.off('updateAxisPointer');
            chartInstanceRef.current.off('globalout');
          }
        };
      }, [activeTab, activeCurves, currentData.barData, selectedCurve]);

      React.useEffect(() => {
        return () => {
          if (chartInstanceRef.current) {
            chartInstanceRef.current.dispose();
            chartInstanceRef.current = null;
          }
        };
      }, []);
      
      return (
        <div className="iphone-screen">
          <StatusBar />
          
          {/* Header */}
          <div className="sticky-top" style={{padding: '0 16px'}}>
            <div className="flex items-center justify-between" style={{height: 56}}>
              <button className="clickable p-2 -ml-2" onClick={() => onNavigate('archive')}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                  <path d="M15 18l-6-6 6-6" stroke="#4527A0" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
              <span style={{fontSize: 18, fontWeight: 600, color: '#212121'}}>水质分析</span>
              <div style={{width: 40}}></div>
            </div>
          </div>
          
          <div className="content-scroll px-4">
            {/* Tab Switcher */}
            <div 
              className="flex items-center justify-between mb-4"
              style={{
                background: '#fff',
                borderRadius: 24,
                padding: 4,
                boxShadow: '0 2px 8px rgba(0,0,0,0.06)'
              }}
            >
              {tabs.map((tab) => (
                <button
                  key={tab}
                  className="clickable flex-1 py-2 rounded-full"
                  style={{
                    fontSize: 15,
                    fontWeight: 500,
                    color: activeTab === tab ? '#5E35B1' : '#9E9E9E',
                    background: activeTab === tab ? '#EDE7F6' : 'transparent'
                  }}
                  onClick={() => setActiveTab(tab)}
                >
                  {tab}
                </button>
              ))}
            </div>
            
            {/* Date Navigation */}
            <div className="flex items-center justify-between mb-4">
              <button className="clickable p-2" onClick={() => handlePeriodChange(-1)}>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M12 4l-6 6 6 6" stroke="#9E9E9E" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
              <div className="text-center">
                <span style={{fontSize: 18, fontWeight: 600, color: '#212121', display: 'block'}}>
                  {formatDate(currentDate, activeTab)}
                </span>
                <span style={{fontSize: 12, color: '#9E9E9E'}}>
                  {activeTab === '日' ? '日期切换' : '周切换'}
                </span>
              </div>
              <button className="clickable p-2" onClick={() => handlePeriodChange(1)}>
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                  <path d="M8 4l6 6-6 6" stroke="#9E9E9E" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                </svg>
              </button>
            </div>
            
            {/* Score & Monitoring Duration */}
            <div
              className="mb-4"
              style={{
                background: '#FFFFFF',
                borderRadius: 22,
                padding: '18px 18px 18px',
                boxShadow: '0 4px 18px rgba(94, 53, 177, 0.08)'
              }}
            >
              <div className="flex items-stretch justify-between gap-4">
                <div style={{minWidth: 0, flex: 1, paddingTop: 2}}>
                  <div style={{fontSize: 13, color: '#8E8AA8', lineHeight: '18px', marginBottom: 8}}>
                    {activeTab === '日' ? '今日达标率' : '本周达标率'}
                  </div>
                  <div className="flex items-end gap-1.5" style={{marginBottom: 8}}>
                    <span style={{fontSize: 44, fontWeight: 700, color: '#212121', lineHeight: '42px'}}>{currentData.score}</span>
                    <span style={{fontSize: 17, color: '#757575', lineHeight: '28px'}}>%</span>
                  </div>
                  <div style={{fontSize: 16, fontWeight: 600, color: getQualityStatus(currentData.score).color, lineHeight: '22px', marginBottom: 0}}>
                    水质{currentData.scoreLabel}
                  </div>
                </div>
                <div
                  style={{
                    flexShrink: 0,
                    width: activeTab === '日' ? 150 : 162,
                    background: '#F8F5FF',
                    borderRadius: 18,
                    padding: '14px 14px 13px'
                  }}
                >
                  <div style={{fontSize: 12, color: '#8E8AA8', lineHeight: '18px', marginBottom: 10}}>
