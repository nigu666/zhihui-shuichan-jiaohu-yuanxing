    };
    
    // ========== 养殖小目标 ==========
    const BREEDING_GOAL_STORAGE_KEY = 'ieasyfm_breeding_goals_v1';
    const BREEDING_PRESETS = {
      species: ['桂鱼', '鲈鱼', '珍珠龙胆', '石斑鱼', '东星斑', '小石斑', '大石斑', '珍珠龙胆石斑鱼苗'],
      pondsByArea: {
        'A区': ['1', '2', '3', '4', '5', '6'],
        'B区': ['1', '2', '3', '4', '5', '6'],
        'C区': ['1', '2', '3', '4', '5', '6', '7', '8'],
        'E区': ['1', '2', '3', '4']
      },
      feeds: ['东丸6号料', '东丸7号料', '东丸8号料', '统一4号料', '鱼尔Z4', '渔尔Z5', '其他'],
      diseases: ['无异常', '体表烂身', '蒙眼', '畸形', '肝门红肿', '胸鳍溃烂', '残食', '空腹', '其他']
    };
    const BREEDING_SPECIES_ALIASES = [
      ['珍珠龙胆石斑鱼苗', ['珍珠龙胆石斑鱼苗', '龙胆石斑鱼苗', '珍珠龙胆苗']],
      ['珍珠龙胆', ['珍珠龙胆', '珍珠龙胆石斑', '龙胆石斑']],
      ['东星斑', ['东星斑', '东星']],
      ['小石斑', ['小石斑']],
      ['大石斑', ['大石斑']],
      ['石斑鱼', ['石斑鱼', '石斑']],
      ['桂鱼', ['桂鱼', '鳜鱼', '鳜', '桂花鱼']],
      ['鲈鱼', ['鲈鱼', '海鲈', '加州鲈']]
    ];
    const matchBreedingPreset = value => {
      const text = String(value || '').replace(/\s/g, '');
      if (!text || /降低|死亡|风险|怎么|如何|高密度|混养|解决|改善|提高|前期/.test(text)) return null;
      const match = BREEDING_SPECIES_ALIASES.find(([species, aliases]) => BREEDING_PRESETS.species.includes(species) && aliases.some(alias => text.includes(alias)));
      return match?.[0] || null;
    };

    const AlarmPage = ({ onExit, onOpenDetail, onOpenForm, currentUser, setCurrentUser, currentSystem, setCurrentSystem, factoryList, alertRecords, viewState, setViewState }) => {
      const scrollRef = React.useRef(null);
      const pageSize = 4;
      const selectedFactory = factoryList.find(factory => factory.name === currentUser) || factoryList[0];
      const activeTab = viewState.tab || 'current';
      const filtered = alertRecords.filter(record => record.factoryId === selectedFactory?.id && record.systemId === currentSystem);
      const currentAlerts = filtered.filter(record => record.status === 'pending');
      const historyAlerts = filtered.filter(record => record.status === 'completed').sort((a, b) => new Date(b.completedTime) - new Date(a.completedTime));
      const records = activeTab === 'current' ? currentAlerts : historyAlerts;
      const pageCount = Math.max(1, Math.ceil(records.length / pageSize));
      const requestedPage = activeTab === 'current' ? viewState.currentPage : viewState.historyPage;
      const safePage = Math.min(Math.max(requestedPage || 1, 1), pageCount);
      const pageRecords = records.slice((safePage - 1) * pageSize, safePage * pageSize);
      const levelStyles = {
        '紧急故障': {color: '#C62828', background: '#FFEBEE'},
        '设备故障': {color: '#E65100', background: '#FFE0B2'},
        '运行异常': {color: '#EF6C00', background: '#FFF3E0'},
        '一般提醒': {color: '#616161', background: '#F1F1F1'}
      };

      useEffect(() => {
        if (requestedPage !== safePage) setViewState(prev => ({...prev, [activeTab === 'current' ? 'currentPage' : 'historyPage']: safePage}));
      }, [requestedPage, safePage, activeTab]);
      useEffect(() => {
        const frame = requestAnimationFrame(() => {
          if (!scrollRef.current) return;
          if (viewState.focusId) {
            const target = scrollRef.current.querySelector(`[data-alert-id="${viewState.focusId}"]`);
            if (target) target.scrollIntoView({block: 'center'});
            setViewState(prev => ({...prev, focusId: null, scrollTop: scrollRef.current?.scrollTop || 0}));
          } else scrollRef.current.scrollTop = viewState.scrollTop || 0;
        });
        return () => cancelAnimationFrame(frame);
      }, []);
      const saveScroll = () => setViewState(prev => ({...prev, scrollTop: scrollRef.current?.scrollTop || 0}));
      const switchTab = tab => setViewState(prev => ({...prev, tab, scrollTop: 0}));
      const changePage = page => setViewState(prev => ({...prev, [activeTab === 'current' ? 'currentPage' : 'historyPage']: Math.min(Math.max(page, 1), pageCount), scrollTop: 0}));
      const openDetail = record => { saveScroll(); onOpenDetail(record.id); };
      const openForm = (event, record) => { event.stopPropagation(); if (record.status !== 'pending') return; saveScroll(); onOpenForm(record.id, 'alarm'); };

      return <div className="iphone-screen" style={{background: 'linear-gradient(135deg, #F7F4FF 0%, #FFFFFF 48%, #F6F2FF 100%)', overflowX: 'hidden'}}>
        <MaintenanceHeader title="告警中心" onBack={onExit} />
        <div ref={scrollRef} className="content-scroll" style={{padding: '16px 14px calc(220px + env(safe-area-inset-bottom, 0px))', overflowX: 'hidden'}}>
          <div className="glass-card-soft" style={{position: 'relative', zIndex: 4, borderRadius: 18, padding: 12, marginBottom: 15, display: 'grid', gridTemplateColumns: 'minmax(0, 1fr)', gap: 9}}>
            <select aria-label="工厂筛选" value={selectedFactory?.id || ''} onChange={event => { const factory = factoryList.find(item => item.id === event.target.value); if (factory) { setCurrentUser(factory.name); setViewState(prev => ({...prev, currentPage: 1, historyPage: 1, scrollTop: 0})); } }} style={{boxSizing: 'border-box', width: '100%', minWidth: 0, border: '1px solid #DDD4F1', borderRadius: 10, padding: '9px 10px', color: '#4527A0', background: '#fff', fontSize: 13}}>{factoryList.map(factory => <option key={factory.id} value={factory.id}>{factory.name}</option>)}</select>
            <select aria-label="系统筛选" value={currentSystem} onChange={event => { setCurrentSystem(event.target.value); setViewState(prev => ({...prev, currentPage: 1, historyPage: 1, scrollTop: 0})); }} style={{boxSizing: 'border-box', width: '100%', minWidth: 0, border: '1px solid #DDD4F1', borderRadius: 10, padding: '9px 10px', color: '#4527A0', background: '#fff', fontSize: 13}}><option value="一号系统">一号系统</option><option value="二号系统">二号系统</option></select>
          </div>
          <div style={{display: 'flex', gap: 7, padding: 4, borderRadius: 15, background: '#EEEAF7', marginBottom: 15}}>
            {[['current', `当前告警 ${currentAlerts.length}`], ['history', `历史告警 ${historyAlerts.length}`]].map(([key, label]) => <button key={key} className="clickable" onClick={() => switchTab(key)} style={{flex: 1, minWidth: 0, border: 'none', borderRadius: 11, padding: '10px 3px', fontSize: 13, fontWeight: 650, color: activeTab === key ? '#fff' : '#786C94', background: activeTab === key ? '#5E35B1' : 'transparent', whiteSpace: 'nowrap'}}>{label}</button>)}
          </div>
          {pageRecords.length === 0 ? <div style={{padding: '46px 12px', textAlign: 'center', color: '#8B8299', background: 'rgba(255,255,255,.72)', borderRadius: 18}}>{activeTab === 'current' ? '暂无待处理告警' : '暂无历史告警记录'}</div> : <div style={{display: 'grid', gap: 12}}>{pageRecords.map(record => {
            const completed = record.status === 'completed'; const levelStyle = levelStyles[record.alertLevel] || levelStyles['一般提醒'];
            return <div key={record.id} data-alert-id={record.id} className="glass-card-soft clickable" onClick={() => openDetail(record)} style={{borderRadius: 18, padding: 15, minWidth: 0, overflow: 'hidden', outline: viewState.focusId === record.id ? '2px solid #7E57C2' : 'none'}}>
              <div style={{display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', gap: 8}}><strong style={{minWidth: 0, fontSize: 15, overflowWrap: 'anywhere'}}>{record.alertName}</strong><div style={{display: 'flex', flexWrap: 'wrap', justifyContent: 'flex-end', gap: 5, flexShrink: 0, maxWidth: '48%'}}><span style={{fontSize: 11, fontWeight: 650, color: levelStyle.color, background: levelStyle.background, borderRadius: 999, padding: '3px 7px'}}>{record.alertLevel}</span><span style={{fontSize: 11, fontWeight: 650, color: completed ? '#2E7D32' : '#C65B12', background: completed ? '#E8F5E9' : '#FFF0E3', borderRadius: 999, padding: '3px 7px'}}>{completed ? '已完成' : '待办'}</span></div></div>
              <div style={{fontSize: 12, color: '#746B80', marginTop: 7, overflowWrap: 'anywhere'}}>{record.deviceName} · {record.deviceCode}</div>
              <div style={{fontSize: 13, color: '#424242', lineHeight: '20px', marginTop: 9, overflowWrap: 'anywhere', wordBreak: 'break-word'}}>{record.alertContent}</div>
              <div style={{fontSize: 12, color: '#8E8795', marginTop: 8}}>告警时间：{record.alertTime}</div>
              {completed && <><div style={{fontSize: 12, color: '#2E7D32', marginTop: 3}}>实际处理时间：{record.completedTime}</div><div style={{fontSize: 12, color: '#8E8795', marginTop: 3}}>处理人：{record.handlerName}</div></>}
              {!completed && <div style={{display: 'flex', justifyContent: 'flex-end', marginTop: 12}}><button className="clickable" onClick={event => openForm(event, record)} style={{border: 'none', borderRadius: 10, padding: '8px 18px', background: '#5E35B1', color: '#fff', fontSize: 13, fontWeight: 650}}>处理</button></div>}
            </div>;
          })}</div>}
          {records.length > 0 && <div style={{display: 'flex', alignItems: 'center', justifyContent: 'center', flexWrap: 'wrap', gap: 10, marginTop: 18}}><button className="clickable" disabled={safePage === 1} onClick={() => changePage(safePage - 1)} style={{border: 'none', borderRadius: 9, padding: '8px 12px', background: safePage === 1 ? '#ECEAF0' : '#EEE7FA', color: safePage === 1 ? '#B0ABB9' : '#5E35B1'}}>上一页</button><span style={{fontSize: 13, color: '#5E35B1', minWidth: 42, textAlign: 'center'}}>{safePage} / {pageCount}</span><button className="clickable" disabled={safePage === pageCount} onClick={() => changePage(safePage + 1)} style={{border: 'none', borderRadius: 9, padding: '8px 12px', background: safePage === pageCount ? '#ECEAF0' : '#EEE7FA', color: safePage === pageCount ? '#B0ABB9' : '#5E35B1'}}>下一页</button></div>}
        </div>
      </div>;
    };

    const BreedingGoalStore = {
      load() {
        try {
          const parsed = JSON.parse(localStorage.getItem(BREEDING_GOAL_STORAGE_KEY) || '[]');
          return Array.isArray(parsed) ? parsed.filter(item => item && item.id && Array.isArray(item.dailyRecords)) : [];
        } catch (error) {
          console.warn('养殖小目标数据解析失败，已使用空数据。', error);
          return [];
        }
      },
      save(goals) {
        try {
          localStorage.setItem(BREEDING_GOAL_STORAGE_KEY, JSON.stringify(goals));
          return true;
        } catch (error) {
          console.error('养殖小目标保存失败', error);
          return false;
        }
      }
    };

    // 统一 AI 适配器：原型未暴露可复用的计划接口，因此仅在此处提供本地降级。
    const generateBreedingGoalPlan = async (profile) => {
      if (typeof window !== 'undefined' && typeof window.ieasyfmGenerateBreedingPlan === 'function') {
        try { return await window.ieasyfmGenerateBreedingPlan(profile); } catch (error) { console.warn('养殖计划 AI 调用失败，使用本地方案。', error); }
      }
      return {
        source: 'local-fallback',
        title: `${profile.species} ${profile.cycleDays}天养殖计划`,
        modules: ['fish', 'water', 'feeding'],
        suggestions: {
          fish: '每日观察鱼体、摄食与损耗，记录平均体长和体重。',
          water: '每日确认液位、溶氧、pH 与温度，异常时补充高级指标。',
          feeding: '按鱼体总重量核算投喂量和投饵率，结合摄食状态调整。'
        }
      };
    };

    // 与全局 AI 助手共用同一请求入口，养殖建议和对话框不会各自再发起一次分析请求。
    const requestExistingAiAssistant = async ({ systemPrompt, messages, temperature = 0.4, maxTokens = 1800 }) => {
      const response = await fetch('https://api.deepseek.com/v1/chat/completions', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer __REDACTED_DEEPSEEK_API_KEY__' },
        body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'system', content: systemPrompt }, ...messages], temperature, max_tokens: maxTokens, stream: false })
      });
      if (!response.ok) throw new Error(`AI 请求失败（${response.status}）`);
      const data = await response.json();
      const content = data?.choices?.[0]?.message?.content;
      if (!content) throw new Error('AI 未返回有效内容');
      return content;
    };

    const makeLocalBreedingAdvice = payload => {
      const hasFishRisk = payload.ponds.some(pond => Number(pond.fish.lossCount) > 0 || (pond.fish.diseases || []).some(item => item && item !== '无异常'));
      const hasWaterRisk = Number(payload.water.dissolvedOxygen) > 0 && Number(payload.water.dissolvedOxygen) < 5.5;
      const hasDeviceRisk = payload.equipment.alerts.length > 0 || payload.equipment.devices.some(device => device.status === 'fault');
      const riskLevel = hasWaterRisk || hasDeviceRisk ? '中' : hasFishRisk ? '中低' : '低';
      return {
        overall: {
          status: `已完成${payload.date}鱼情、水质和投喂填报，当前养殖状态${riskLevel === '低' ? '总体平稳' : '需重点关注异常项'}。`,
          riskLevel,
          focus: [hasFishRisk ? '关注损失数量与鱼病筛查结果。' : '继续观察摄食和活动状态。', hasWaterRisk ? '溶氧偏低，优先核验增氧与循环。' : '保持水质关键指标日常复测。', hasDeviceRisk ? '处理当前系统告警或故障设备。' : '维持关键养殖设备巡检。'].filter(Boolean)
        },
        fish: payload.ponds.map(pond => ({ pondId: pond.pondId, advice: `保持${pond.fish.currentStock || '当前'}尾存池观察，结合摄食状态记录变化。`, focus: hasFishRisk ? '重点复核损失原因、体表和鳃部表现。' : '重点观察摄食、游动及体表状态。', diseaseRisk: (pond.fish.diseases || []).filter(item => item !== '无异常').join('、') || '未见已填报异常', recheck: Number(pond.fish.lossCount) > 0 ? '建议复测存池数量、体长和体重。' : '如摄食异常，再复测体长、体重。' })),
        water: { focus: `重点复测溶氧 ${payload.water.dissolvedOxygen || '—'} mg/L、pH ${payload.water.ph || '—'} 和温度 ${payload.water.temperature || '—'}℃。`, adjustment: hasWaterRisk ? '提高曝气与循环效率，复核溶氧探头。' : '维持当前水处理节奏，关注昼夜波动。', increaseTesting: hasWaterRisk ? '建议增加检测频次。' : '按日常频次检测，异常时加测。' },

                    <div><div style={{fontSize:18,fontWeight:780}}>{goal.species}</div><div className="bg-goal-meta"><span>{goal.batch}</span><span>{goal.area}</span><span>{goal.pondIds.length}个鱼池：{goal.pondIds.join('、')}</span><span>{goal.startDate} 起</span><span>第 {dayNumber(goal)}/{goal.cycleDays} 天</span></div></div>
                    <button className="bg-secondary clickable" onClick={() => { setMainScroll(scrollRef.current?.scrollTop || 0); setSelectedGoalId(goal.id); setExpandedDate(goal.dailyRecords.slice().sort((a,b)=>b.date.localeCompare(a.date))[0]?.date || null); setView('detail'); }}>详情</button>
                  </div>
                  {index === 0 && <><div className="bg-progress"><i style={{width:`${doneCount / 3 * 100}%`}}/></div><div className="bg-muted">{doneCount === 3 ? '今日已完成' : `今日完成 ${doneCount}/3`}</div>
                    <div style={{marginTop:10}}>{tasks.map(task => <div className="bg-task" key={task.key}><div className="bg-task-icon"><BGIcon type={task.icon}/></div><div><div style={{fontSize:14,fontWeight:700}}>{task.label}</div><div className="bg-muted">{task.desc}</div></div><button className={`bg-task-btn clickable ${record.completionStatus[task.key] === 'submitted' ? 'done' : ''}`} onClick={() => openDaily(goal, task.key)}>{record.completionStatus[task.key] === 'submitted' ? '已完成' : '打卡'}</button></div>)}</div>
                    <AdviceCard goal={goal} record={record}/>
                    <button className="bg-secondary bg-danger clickable" style={{marginTop:10}} onClick={() => finishGoal(goal)}>结束目标</button>
                  </>}
                </div>;
              })}
              {activeGoals.length > 1 && <button className="bg-more clickable" onClick={() => setExpandedGoals(value => !value)}>{expandedGoals ? '收起其他小目标' : `展开更多小目标（${activeGoals.length - 1}）`}</button>}
            </>
          }
        </>
      );

      const createContent = draft && (
        <>
          <div className="bg-card bg-ai-message"><div className="bg-ai-badge">AI</div><div>我会依据站点、品种、鱼池和周期生成每日养殖计划。请先确认基础资料，多鱼池投放量会自动汇总。</div></div>
          <div className="bg-card bg-form-card">
            {[
              ['站点名称', <input className="bg-input" value={draft.siteName} onChange={e=>updateDraft({siteName:e.target.value})}/>],
              ['养殖品种', <select className="bg-select" value={draft.species} onChange={e=>updateDraft({species:e.target.value})}>{!BREEDING_PRESETS.species.includes(draft.species)&&<option>{draft.species}</option>}{BREEDING_PRESETS.species.map(item=><option key={item}>{item}</option>)}</select>],
              ['养殖区域', <select className="bg-select" value={draft.area} onChange={e=>updateDraft({area:e.target.value,pondIds:[],initialStockByPond:{}})}>{Object.keys(BREEDING_PRESETS.pondsByArea).map(item=><option key={item}>{item}</option>)}</select>]
            ].map(([label,control])=><div className="bg-field" key={label}><label className="bg-label">{label}<span className="required">*</span></label>{control}</div>)}
            <div className="bg-field"><label className="bg-label">鱼池编号（可多选）<span className="required">*</span></label><div className="bg-chips">{BREEDING_PRESETS.pondsByArea[draft.area].map(id=><button className={`bg-chip clickable ${draft.pondIds.includes(id)?'active':''}`} key={id} onClick={()=>togglePond(id)}>{id}号池</button>)}</div></div>
            <div className="bg-field"><label className="bg-label">养殖批次<span className="required">*</span></label><input className="bg-input" value={draft.batch} onChange={e=>updateDraft({batch:e.target.value})}/></div>
            <div className="bg-two-col stack-small">
              <div className="bg-field"><label className="bg-label">养殖周期（天）<span className="required">*</span></label><input key="cycleDays" type="text" inputMode="numeric" className="bg-input" value={draft.cycleDays} onChange={e=>updateDraft({cycleDays:e.target.value,endDate:addDays(draft.startDate,e.target.value)})}/></div>
              <div className="bg-field"><label className="bg-label">养殖起始日期<span className="required">*</span></label><input type="date" className="bg-input" value={draft.startDate} onChange={e=>updateDraft({startDate:e.target.value,endDate:addDays(e.target.value,draft.cycleDays)})}/></div>
            </div>
            <div className="bg-field"><label className="bg-label">结束日期（自动计算）</label><input className="bg-input bg-readonly" readOnly value={addDays(draft.startDate,draft.cycleDays)}/></div>
            <div className="bg-field"><label className="bg-label">初始投放量（尾/池）<span className="required">*</span></label>{draft.pondIds.length ? draft.pondIds.map(id=><div className="bg-two-col" style={{alignItems:'center',marginBottom:8}} key={`initialStock-${id}`}><span style={{fontSize:13,fontWeight:650}}>{id}号池</span><input key={`initialStock-${id}-value`} type="text" inputMode="numeric" className="bg-input" placeholder="请输入尾数" value={draft.initialStockByPond[id]||''} onChange={e=>updateDraft({initialStockByPond:{...draft.initialStockByPond,[id]:e.target.value}})}/></div>) : <div className="bg-muted">请先选择鱼池</div>}</div>
            <div className="bg-total">初始投放总量：{initialTotal} 尾</div>
            {formError && <div className="bg-error">{formError}</div>}
            <button className="bg-primary clickable" style={{width:'100%',marginTop:16}} disabled={isGenerating} onClick={createGoal}>{isGenerating?'正在生成养殖计划…':'生成养殖计划'}</button>
          </div>
        </>
      );

      const dailyContent = selectedGoal && recordDraft && (
        <>
          <GoalSummary goal={selectedGoal}/>
          <div className="bg-step" id="bg-step-fish"><span className="bg-step-dot"/><h3 className="bg-section-title">1. 鱼情填报 {recordDraft.completionStatus.fish === 'submitted' && <span className="bg-status done"><BGIcon type="check" size={15}/>已完成</span>}</h3>
            {selectedGoal.pondIds.map(pondId => {
              const item=recordDraft.fishRecordsByPond[pondId], locked=item.status==='submitted';
              return <PondAccordion kind="fish" pondId={pondId} open={fishOpen} setOpen={setFishOpen} item={item} key={`${selectedGoal.id}-fish-${pondId}`}>
                <div className="bg-two-col"><div className="bg-field"><label className="bg-label">平均体长（cm）</label><input key={`${selectedGoal.id}-${pondId}-averageLength`} disabled={locked} type="text" inputMode="decimal" className="bg-input" value={item.averageLength} onChange={e=>updateFish(pondId,{averageLength:e.target.value})}/></div><div className="bg-field"><label className="bg-label">平均体重（g）</label><input key={`${selectedGoal.id}-${pondId}-averageWeight`} disabled={locked} type="text" inputMode="decimal" className="bg-input" value={item.averageWeight} onChange={e=>updateFish(pondId,{averageWeight:e.target.value})}/></div></div>
                <div className="bg-two-col"><div className="bg-field"><label className="bg-label">上一次存池数量</label><input readOnly className="bg-input bg-readonly" value={item.previousStock}/></div><div className="bg-field"><label className="bg-label">当日损失数量</label><input key={`${selectedGoal.id}-${pondId}-lossCount`} disabled={locked} type="text" inputMode="numeric" className="bg-input" value={item.lossCount} onChange={e=>updateFish(pondId,{lossCount:e.target.value})}/></div></div>
                <div className="bg-two-col"><div className="bg-field"><label className="bg-label">当前存池数量</label><input readOnly className="bg-input bg-readonly" value={item.currentStock}/></div><div className="bg-field"><label className="bg-label">当前总重量（kg）</label><input readOnly className="bg-input bg-readonly" value={item.currentTotalWeight===''?'—':item.currentTotalWeight}/></div></div>
                <div className="bg-field"><label className="bg-label">鱼病筛查（可多选）</label><div className="bg-chips">{BREEDING_PRESETS.diseases.map(d=><button disabled={locked} className={`bg-chip ${item.diseases?.includes(d)?'active':''}`} key={d} onClick={()=>toggleDisease(pondId,d)}>{d}</button>)}</div></div>
                <div className="bg-field"><label className="bg-label">备注</label><textarea disabled={locked} className="bg-textarea" value={item.note} onChange={e=>updateFish(pondId,{note:e.target.value})}/></div>
                <div className="flex items-center gap-2" style={{marginBottom:12}}><button className="bg-secondary" disabled={locked} onClick={()=>{setImagePond(pondId);dailyImageRef.current?.click();}}><BGIcon type="camera" size={17}/> 添加图片</button><span className="bg-muted">{item.images?.length||0}/2（单张≤300KB）</span></div>
                <button className="bg-primary" disabled={locked} onClick={()=>submitFish(pondId)}>{locked?'已提交（只读）':'完成本池鱼情'}</button>
              </PondAccordion>;
            })}
          </div>
          <div className="bg-step" id="bg-step-water"><span className="bg-step-dot"/><h3 className="bg-section-title">2. 水质确认 {recordDraft.completionStatus.water === 'submitted' && <span className="bg-status done"><BGIcon type="check" size={15}/>已完成</span>}</h3><div className="bg-card bg-form-card">
            <div className="bg-muted" style={{marginBottom:12}}>读取自首页 · {recordDraft.commonWaterRecord.systemName} · 更新于 {recordDraft.commonWaterRecord.updatedAt} · 多鱼池共用</div>
            <div className="bg-water-grid">{[['liquidLevel','液位（mm）'],['dissolvedOxygen','溶氧（mg/L）'],['ph','pH'],['temperature','温度（℃）']].map(([key,label])=><div className="bg-field" key={`${selectedGoal.id}-water-${key}`}><label className="bg-label">{label}</label><input disabled={recordDraft.commonWaterRecord.status==='submitted'} type="text" inputMode="decimal" className="bg-input" value={recordDraft.commonWaterRecord[key]} onChange={e=>setRecordDraft(prev=>({...prev,commonWaterRecord:{...prev.commonWaterRecord,[key]:e.target.value}}))}/></div>)}</div>
            <button className="bg-secondary" onClick={()=>setAdvancedWater(v=>!v)}>{advancedWater?'收起高级水质':'展开高级水质'}</button>
            {advancedWater && <div className="bg-water-grid" style={{marginTop:12}}>{[['ammonia','氨氮'],['nitrite','亚盐'],['kh','KH'],['salinity','盐度'],['bioFilterWater','生物桶水质']].map(([key,label])=><div className="bg-field" key={`${selectedGoal.id}-advancedWater-${key}`}><label className="bg-label">{label}</label><input disabled={recordDraft.commonWaterRecord.status==='submitted'} type="text" inputMode="decimal" className="bg-input" value={recordDraft.commonWaterRecord[key]} onChange={e=>setRecordDraft(prev=>({...prev,commonWaterRecord:{...prev.commonWaterRecord,[key]:e.target.value}}))}/></div>)}</div>}
            <button className="bg-primary" style={{marginTop:12}} disabled={recordDraft.commonWaterRecord.status==='submitted'} onClick={submitWater}>{recordDraft.commonWaterRecord.status==='submitted'?'已确认（只读）':'确认本次共性水质'}</button>
          </div></div>
          <div className="bg-step" id="bg-step-feeding"><span className="bg-step-dot"/><h3 className="bg-section-title">3. 投喂填报 {recordDraft.completionStatus.feeding === 'submitted' && <span className="bg-status done"><BGIcon type="check" size={15}/>已完成</span>}</h3>
            {selectedGoal.pondIds.map(pondId => {
              const item=recordDraft.feedingRecordsByPond[pondId], submitting=submittingFeedingPond===pondId, locked=item.status==='submitted'||submitting;
              return <PondAccordion kind="feed" pondId={pondId} open={feedOpen} setOpen={setFeedOpen} item={item} key={`${selectedGoal.id}-feed-${pondId}`}>
                <div className="bg-two-col"><div className="bg-field"><label className="bg-label">饵料选择</label><select disabled={locked} className="bg-select" value={item.feed} onChange={e=>updateFeeding(pondId,{feed:e.target.value})}><option value="">请选择</option>{BREEDING_PRESETS.feeds.map(v=><option key={v}>{v}</option>)}</select></div><div className="bg-field"><label className="bg-label">饵料粒径</label><input key={`${selectedGoal.id}-${pondId}-particleSize`} disabled={locked} type="text" inputMode="decimal" className="bg-input" placeholder="如 3.0mm" value={item.particleSize} onChange={e=>updateFeeding(pondId,{particleSize:e.target.value})}/></div></div>
                <div className="bg-two-col"><div className="bg-field"><label className="bg-label">单次投喂量（kg）</label><input key={`${selectedGoal.id}-${pondId}-singleAmount`} disabled={locked} type="text" inputMode="decimal" className="bg-input" value={item.singleAmount} onChange={e=>updateFeeding(pondId,{singleAmount:e.target.value})}/></div><div className="bg-field"><label className="bg-label">投喂频次</label><input key={`${selectedGoal.id}-${pondId}-frequency`} disabled={locked} type="text" inputMode="decimal" className="bg-input" value={item.frequency} onChange={e=>updateFeeding(pondId,{frequency:e.target.value})}/></div></div>
                <div className="bg-two-col"><div className="bg-field"><label className="bg-label">当日投喂总量（kg）</label><input readOnly className="bg-input bg-readonly" value={item.dailyTotal===''?'—':item.dailyTotal}/></div><div className="bg-field"><label className="bg-label">当前鱼体总重量（kg）</label><input readOnly className="bg-input bg-readonly" value={item.bodyTotalWeight===''?'—':item.bodyTotalWeight}/></div></div>
                <div className="bg-field"><label className="bg-label">投饵率（%）</label><input readOnly className="bg-input bg-readonly" value={item.feedingRate}/></div><div className="bg-field"><label className="bg-label">投喂备注</label><textarea disabled={locked} className="bg-textarea" value={item.note} onChange={e=>updateFeeding(pondId,{note:e.target.value})}/></div>
                <button type="button" className="bg-primary" disabled={locked} onClick={event=>submitFeeding(event,pondId)}>{submitting?'提交中…':item.status==='submitted'?'已提交（只读）':'完成本池投喂'}</button>
              </PondAccordion>;
            })}
          </div>
        </>
      );

      const detailContent = selectedGoal && (() => {
        const records=selectedGoal.dailyRecords.slice().sort((a,b)=>b.date.localeCompare(a.date));
        return <><GoalSummary goal={selectedGoal}/><div className="bg-card bg-form-card"><div className="flex justify-between"><strong>当前进度</strong><span>{selectedGoal.status==='completed'?'已完成':`第 ${dayNumber(selectedGoal)} 天`}</span></div><div className="bg-progress"><i style={{width:`${Math.min(100,dayNumber(selectedGoal)/selectedGoal.cycleDays*100)}%`}}/></div></div>
          {records.length===0?<div className="bg-empty" style={{minHeight:'30vh'}}>暂无每日填报记录</div>:<div className="bg-timeline">{records.map(record=><div className="bg-date-card bg-card" key={record.date}><button className="bg-pond-head" onClick={()=>setExpandedDate(expandedDate===record.date?null:record.date)}><strong>{record.date}</strong><span className="bg-muted">{Object.values(record.completionStatus).filter(v=>v==='submitted').length}/3 项完成</span></button>{expandedDate===record.date&&<div className="bg-pond-body">
            <div className="bg-field"><strong>共性水质</strong><div className="bg-muted" style={{marginTop:6}}>液位 {record.commonWaterRecord.liquidLevel}mm · 溶氧 {record.commonWaterRecord.dissolvedOxygen}mg/L · pH {record.commonWaterRecord.ph} · 温度 {record.commonWaterRecord.temperature}℃</div></div>
            {selectedGoal.pondIds.map(pondId=>{const fish=record.fishRecordsByPond[pondId],feed=record.feedingRecordsByPond[pondId];return <div className="bg-pond" key={pondId}><button className="bg-pond-head" onClick={()=>setExpandedPond(expandedPond===`${record.date}-${pondId}`?null:`${record.date}-${pondId}`)}><strong>{pondId}号池</strong><BGIcon type="chevron" size={16}/></button>{expandedPond===`${record.date}-${pondId}`&&<div className="bg-pond-body bg-muted">鱼情：存池 {fish.currentStock}尾，总重量 {fish.currentTotalWeight||'—'}kg，损失 {fish.lossCount||0}尾，筛查 {(fish.diseases||[]).join('、')||'—'}。{fish.note&&`备注：${fish.note}。`}<br/>投喂：{feed.feed||'—'}，日投喂 {feed.dailyTotal||'—'}kg，投饵率 {feed.feedingRate}% 。{feed.note&&`备注：${feed.note}。`}{fish.images?.length>0&&<div>图片 {fish.images.length} 张</div>}</div>}</div>})}
          </div>}</div>)}</div>}</>;
      })();

      const historyContent = view==='historyDetail'&&selectedGoal ? detailContent : completedGoals.length===0?<div className="bg-empty"><div className="bg-empty-mark"><BGIcon type="history" size={32}/></div><div style={{fontSize:17,fontWeight:700}}>暂无已完成的小目标</div></div>:completedGoals.map(goal=>{
        const last=goal.dailyRecords.slice().sort((a,b)=>b.date.localeCompare(a.date))[0];
        const finalStock=goal.pondIds.reduce((sum,id)=>sum+(Number(last?.fishRecordsByPond?.[id]?.currentStock)||Number(goal.initialStockByPond[id])||0),0);
        const totalLoss=goal.dailyRecords.reduce((sum,r)=>sum+goal.pondIds.reduce((s,id)=>s+(Number(r.fishRecordsByPond?.[id]?.lossCount)||0),0),0);
        const finalWeight=goal.pondIds.reduce((sum,id)=>sum+(Number(last?.fishRecordsByPond?.[id]?.currentTotalWeight)||0),0);
        return <button className="bg-card bg-goal-card clickable" style={{width:'100%',textAlign:'left'}} key={goal.id} onClick={()=>{setSelectedGoalId(goal.id);setExpandedDate(last?.date||null);setView('historyDetail')}}><div className="flex justify-between"><strong style={{fontSize:17}}>{goal.species}</strong><span className="bg-status done"><BGIcon type="check" size={15}/>已完成</span></div><div className="bg-goal-meta"><span>{goal.batch}</span><span>{goal.area} · {goal.pondIds.map(id=>`${id}号池`).join('、')}</span><span>{goal.startDate} 至 {goal.endDate}</span></div><div className="bg-summary-grid" style={{marginTop:12}}><div className="bg-summary-item"><small>完成天数 / 总投放</small>{goal.dailyRecords.length}天 / {goal.initialStockTotal}尾</div><div className="bg-summary-item"><small>最终存池 / 累计损失</small>{finalStock}尾 / {totalLoss}尾</div><div className="bg-summary-item"><small>最终总重量</small>{finalWeight.toFixed(3)} kg</div></div></button>;
      });

      return <div className="breeding-goal-page">{header}<input ref={dailyImageRef} type="file" accept="image/*" hidden onChange={attachFishImage}/><div ref={scrollRef} className={`bg-scroll ${view==='main'?'':'no-composer'}`}>
        {view==='main'&&mainContent}{view==='create'&&createContent}{view==='daily'&&dailyContent}{view==='detail'&&detailContent}{(view==='history'||view==='historyDetail')&&historyContent}
      </div>
      {view==='main'&&<div className="bg-bottom"><button type="button" className="bg-add-tab clickable" onClick={()=>setSheetOpen(true)}><BGIcon type="goal" size={17}/>新增小目标</button><BreedingGoalComposer placeholder="输入你的养殖小目标" value={customGoalInput} onChange={setCustomGoalInput} onSend={sendMainGoal} sending={isMainGoalSending}/></div>}
      {sheetOpen&&<><div className="bg-overlay" onClick={closeSheet}/><div className="bg-sheet" role="dialog" aria-modal="true" aria-label="新增小目标"><div className="bg-sheet-head"><div style={{fontSize:19,fontWeight:780}}>新增小目标</div><button type="button" className="bg-icon-btn" onClick={closeSheet} aria-label="关闭"><BGIcon type="close"/></button></div><div className="bg-sheet-scroll"><div className="bg-label" style={{fontSize:15}}>推荐</div><div className="bg-recommend-grid">{BREEDING_PRESETS.species.map(species=><button type="button" className="bg-recommend clickable" key={species} onClick={()=>startCreate(species)}><span className="bg-recommend-icon"><BGIcon type="fish" size={19}/></span><span className="bg-recommend-name" style={{fontWeight:650}}>养殖{species}</span><BGIcon type="arrow" size={16}/></button>)}</div>{customGoalAnalysisStatus==='analyzing'&&<div className="bg-custom-analysis"><h4>AI 专属计划</h4>正在分析你的养殖需求…</div>}{customGoalAnalysisStatus==='completed'&&customGoalAnalysis&&<div className="bg-custom-analysis"><h4>AI 专属计划 <span className="bg-muted">{customGoalAnalysis.source}</span></h4><div><strong>需求识别：</strong>{customGoalAnalysis.demandUnderstanding}</div><div className="bg-custom-analysis-section"><strong>计划摘要：</strong>{customGoalAnalysis.summary}<br/>品种/问题：{customGoalAnalysis.identifiedSpecies} · {customGoalAnalysis.goalType}<br/>推荐模式：{customGoalAnalysis.recommendedMode}</div><div className="bg-custom-analysis-section"><strong>重点风险：</strong>水质：{customGoalAnalysis.risks?.water}；病害：{customGoalAnalysis.risks?.disease}；设备：{customGoalAnalysis.risks?.device}；投喂：{customGoalAnalysis.risks?.feeding}</div><div className="flex gap-2" style={{marginTop:12}}><button type="button" className="bg-primary clickable" style={{flex:1,boxShadow:'none'}} onClick={continueCreateWithAnalysis}>继续创建计划</button><button type="button" className="bg-secondary clickable" onClick={()=>resetCustomGoalAnalysis(true)}>重新输入</button></div></div>}{customGoalAnalysisStatus==='failed'&&<div className="bg-custom-analysis"><h4>AI 专属计划</h4><div>{customGoalAnalysisError || 'AI 分析暂时不可用，请补充品种后继续创建。'}</div><div className="flex gap-2" style={{marginTop:12}}><button type="button" className="bg-primary clickable" style={{flex:1,boxShadow:'none'}} onClick={continueManualCreate}>继续手动创建</button><button type="button" className="bg-secondary clickable" onClick={()=>resetCustomGoalAnalysis(true)}>重新输入</button></div></div>}</div><div className="bg-custom-row"><BreedingGoalComposer autoFocus placeholder="输入自定义养殖目标" value={customGoalInput} onChange={setCustomGoalInput} onSend={sendSheetGoal} sending={isSheetGoalSending||customGoalAnalysisStatus==='analyzing'}/></div></div></>}
      </div>;
    };

    // ========== 控制策略详情页 ==========
    const ControlStrategyPage = ({ onExit, onToast, strategyStatus, setStrategyStatus }) => {
      const [activeStrategy, setActiveStrategy] = useState(null);
      const [confirmDialog, setConfirmDialog] = useState({ open: false, title: '', message: '', action: null });

      const strategies = [
        {
          id: 'pump',
          name: '水泵自运行切换',
          icon: <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2l4 4H6l4-4z" stroke="#5E35B1" strokeWidth="1.5" strokeLinecap="round"/><path d="M10 18l-4-4h8l-4 4z" stroke="#5E35B1" strokeWidth="1.5" strokeLinecap="round"/><path d="M10 6v8" stroke="#5E35B1" strokeWidth="1.5" strokeLinecap="round"/></svg>,
          code: 'STR-001',
          triggerType: '液位联动',
          status: 'running',
          description: '根据液位自动切换水泵运行状态，低液位自动启动，高液位自动停止',
          devices: ['水泵1号', '水泵2号', '液位传感器'],
          logic: [
            { condition: '液位 < 30%', action: '启动水泵1号' },
            { condition: '液位 > 80%', action: '停止水泵1号' },
            { condition: '水泵1号故障', action: '切换至水泵2号' },
          ]
        },
        {
          id: 'temp',
          name: '自动调温',

        if (!editTitle.trim()) {
          onToast('标题不能为空');
          return;
        }
        const originalItem = currentList.find(i => i.id === editingId);
        setKnowledgeList(prev => ({
          ...prev,
          [factoryKey]: (prev[factoryKey] || []).map(item =>
            item.id === editingId ? { ...item, title: editTitle.trim(), content: editContent.trim() } : item
          )
        }));
        if (originalItem) {
          addKnowledgeHistory('修改', { ...originalItem, title: editTitle.trim(), content: editContent.trim() });
        }
        setSelectedItem(prev => prev ? { ...prev, title: editTitle.trim(), content: editContent.trim(), summary: editContent.trim().slice(0, 48) } : prev);
        resetAddState();
        setShowAddForm(false);
        onToast('修改成功');
      };

      const handleDelete = (id) => {
        const item = currentList.find(i => i.id === id);
        if (confirm('确定要删除这条知识库吗？')) {
          setKnowledgeList(prev => ({
            ...prev,
            [factoryKey]: (prev[factoryKey] || []).filter(entry => entry.id !== id)
          }));
          if (item) addKnowledgeHistory('删除', item);
          if (selectedItem?.id === id) setSelectedItem(null);
          onToast('已删除');
        }
      };

      const handleFileUpload = (e, type) => {
        const file = e.target.files?.[0];
        if (!file) {
          e.target.value = '';
          return;
        }
        const sendToAgent = (payload) => {
          if (agentRef?.current?.openKnowledgeUploadChat) {
            agentRef.current.openKnowledgeUploadChat(payload);
          } else {
            onToast('AI助手暂不可用');
          }
        };
        if (type === 'image' || type === 'camera') {
          const reader = new FileReader();
          reader.onload = (event) => {
            sendToAgent({
              uploadType: type,
              fileName: file.name,
              fileSize: `${(file.size / 1024).toFixed(1)} KB`,
              imageData: event.target?.result || ''
            });
          };
          reader.readAsDataURL(file);
        } else {
          sendToAgent({
            uploadType: 'file',
            fileName: file.name,
            fileSize: `${(file.size / 1024).toFixed(1)} KB`
          });
        }
        e.target.value = '';
      };

      const handleRestore = (historyItem) => {
        if (confirm(`确定要恢复 "${historyItem.item.title}" 吗？`)) {
          restoreKnowledge(factoryName, historyItem.item);
          addKnowledgeHistory('恢复', historyItem.item);

          onToast('已恢复');

              </div>
            </div>
          </>

      };

          <StatusBar />
          {selectedItem ? renderDetailPage() : renderMainPage()}

              <div className="expand-panel knowledge-add-sheet" style={{maxHeight: 'calc(100% - 100px)', overflowY: 'auto'}}>
                <div className="flex justify-between mb-4">

                  <button className="clickable w-8 h-8 rounded-full flex items-center justify-center" style={{background: '#F5F5F5'}} onClick={() => setShowAddPanel(false)}>

                  </button>

                <div className="grid grid-cols-3 gap-2">

    const DataService = {
      realtimeData: null,
      documentData: null,
      documentCacheTime: null,
      
      fetchRealtimeData: async () => {
        try {
          const response = await fetch('device-realtime-data.json');
          const data = await response.json();
          DataService.realtimeData = data;
          return data;
        } catch (error) {
          console.error('Failed to fetch realtime data:', error);
          return DataService.realtimeData || null;
        }
      },
      
      fetchDocumentData: async () => {
        const now = Date.now();
        if (DataService.documentData && DataService.documentCacheTime && 
            (now - DataService.documentCacheTime) < 300000) {
          return DataService.documentData;
        }
        
        try {
          const response = await fetch('document-data.json');
          const data = await response.json();
          DataService.documentData = data;
          DataService.documentCacheTime = now;
          return data;
        } catch (error) {
          console.error('Failed to fetch document data:', error);
          return DataService.documentData || null;
        }
      },
      
      searchDocuments: async (query, factoryKey = 'factory1') => {
        const docData = await DataService.fetchDocumentData();
        if (!docData) return [];
        
        const allDocs = [
          ...(docData.knowledgeBase[factoryKey] || []),
          ...(docData.emergencyPlans || []),
          ...(docData.equipmentManuals || []),
          ...(docData.standardOperatingProcedures || [])
        ];
        
        const keywords = query.toLowerCase().split(/\s+/);
        return allDocs.filter(doc => {
          const content = (doc.title || '') + ' ' + (doc.content || '') + ' ' + (doc.tags || []).join(' ');
          const lowerContent = content.toLowerCase();
          return keywords.some(kw => lowerContent.includes(kw));
        }).slice(0, 5);
      },
      
      getRealtimeSummary: async (factoryKey = 'factory1') => {
        const realtimeData = await DataService.fetchRealtimeData();
        if (!realtimeData) return null;
        
        const factoryDevices = realtimeData.devices?.filter(d => d.factory === factoryKey) || [];
        const waterQuality = realtimeData.waterQuality?.[factoryKey];
        const energy = realtimeData.energyConsumption?.[factoryKey];
        
        const runningCount = factoryDevices.filter(d => d.status === 'running').length;
        const stoppedCount = factoryDevices.filter(d => d.status === 'stopped').length;
        
        return {
          deviceCount: factoryDevices.length,
          runningCount,
          stoppedCount,
          waterQuality,
          energy,
          devices: factoryDevices
        };
      },
      
      getAIContext: async (query, factoryKey = 'factory1') => {
        const [realtimeSummary, relevantDocs] = await Promise.all([
          DataService.getRealtimeSummary(factoryKey),
          DataService.searchDocuments(query, factoryKey)
        ]);
        
        let context = '';
        
        if (realtimeSummary) {
          context += `【实时数据】\n`;
          context += `- 设备状态: 运行${realtimeSummary.runningCount}台, 停止${realtimeSummary.stoppedCount}台\n`;
          if (realtimeSummary.waterQuality) {
            context += `- 水质参数:\n`;
            Object.entries(realtimeSummary.waterQuality).forEach(([key, value]) => {
              const labels = {
                ph: 'PH值',
                dissolvedOxygen: '溶氧量',
                ammoniaNitrogen: '氨氮',
                nitrite: '亚硝酸盐',
                temperature: '水温',
                salinity: '盐度'
              };
              context += `  * ${labels[key] || key}: ${value.value}${value.unit || ''}\n`;
            });
          }
          if (realtimeSummary.energy) {
            context += `- 能耗: 今日${realtimeSummary.energy.today}${realtimeSummary.energy.units}, 较昨日${realtimeSummary.energy.today < realtimeSummary.energy.yesterday ? '下降' : '上升'}${Math.abs(realtimeSummary.energy.today - realtimeSummary.energy.yesterday)}${realtimeSummary.energy.units}\n`;
          }
        }
        
        if (relevantDocs.length > 0) {
          context += `\n【相关文档】\n`;
          relevantDocs.forEach((doc, idx) => {
            context += `${idx + 1}. ${doc.title}: ${doc.content.substring(0, 100)}...\n`;
          });
        }
        
        return context;
      }

          category: archiveData.category || '分析报告',
          title: archiveData.title,
          content: archiveData.summary,
          summary: archiveData.summary,
          type: archiveData.mediaType === 'image' ? '图片' : '文档',
          mediaType: archiveData.mediaType,
          fileType: archiveData.fileType,
          fileName: archiveData.fileName,
          time: archiveData.time,
          dateTime: archiveData.dateTime,
          source: archiveData.source,
          relation: archiveData.relation,
          thumbnail: archiveData.thumbnail || '',
          image: archiveData.image || archiveData.thumbnail || '',
          aiReport: archiveData.aiReport,
          createdAt: archiveData.createdAt,
          attachments: []
        };
        setKnowledgeList(prev => ({
          ...prev,
          [key]: [newItem, ...(prev[key] || [])]
        }));
        addKnowledgeHistory('添加', newItem);
        return newItem;
      };
      
      const handleAddPlan = (newPlan) => {
        setEmergencyPlans(prev => [...prev, newPlan]);
      };
      
      const handleDeletePlan = (planId) => {
        setEmergencyPlans(prev => prev.filter(p => p.id !== planId));
      };
      
      const handleEditPlan = (planId, updates) => {
        setEmergencyPlans(prev => prev.map(p => p.id === planId ? { ...p, ...updates } : p));
      };
      
      const executePlan = (planId) => {
        setPlanStatus(prev => ({ ...prev, [planId]: 'running' }));
        setTimeout(() => {
          const detectedFaults = detectFaultyDevices();
          if (detectedFaults.length > 0) {
            setFaultyDevices(detectedFaults);
            setPlanStatus(prev => ({ ...prev, [planId]: 'fault' }));
          } else {
            setFaultyDevices([]);
            setPlanStatus(prev => ({ ...prev, [planId]: 'success' }));
          }
        }, 2000);
      };
      
      const stopPlan = (planId) => {
        setPlanStatus(prev => ({ ...prev, [planId]: 'stopped' }));
        setFaultyDevices([]);
      };
      
      const detectFaultyDevices = () => {
        const faults = [];
        const random = Math.random();
        
        if (random > 0.6) {
          faults.push({ id: 'pump-001', name: '一号水泵', type: '水泵', reason: '电机温度偏高', status: 'warning' });
        }
        if (random > 0.7) {
          faults.push({ id: 'aerator-001', name: '一号增氧机', type: '增氧机', reason: '溶氧量低于阈值', status: 'critical' });
        }
        if (random > 0.8) {
          faults.push({ id: 'compressor-001', name: '一号压缩机', type: '压缩机', reason: '压力异常', status: 'critical' });
        }
        
        return faults;
      };
      
      const getPlanStatus = (planId) => {
        return planStatus[planId] || 'stopped';
      };
      
      const getSelectedPlan = () => {
        return emergencyPlans.find(p => p.id === selectedPlanId) || null;
      };
      
      const showToast = (message) => {
        setToast({ message, visible: true });
        setTimeout(() => { setToast({ message: '', visible: false }); }, 2000);
      };
      
      const navigate = (page) => {
        setCurrentPage(page);
        if (page === 'home') {
          setHomeStickyEntry(null);
          setExpandOpen(false);
          setCameraOpen(false);
          setShowChatHistory(false);
          setIsChatExpanded(false);
        }
      };

      const navigateFromHomeSticky = (page) => {
        setHomeStickyEntry(page);
        setCurrentPage(page);
      };

      const exitStickyModule = (fallbackPage) => {
        navigate(homeStickyEntry ? 'home' : fallbackPage);
      };

      const getMaintenanceHandler = () => (typeof currentUser === 'string' && currentUser.includes('管理员') ? currentUser : '管理员');
      const getSelectedMaintenance = () => {
        if (workOrderContext.source === 'alertCenter') return alertRecords.find(record => record.id === workOrderContext.recordId) || null;
        return maintenanceRecords.find(record => record.id === workOrderContext.recordId) || null;
      };
      const normalizeWorkOrderOptions = (options, fallbackReturn) => typeof options === 'string' ? {source: 'equipmentManager', returnView: options} : {source: 'equipmentManager', returnView: fallbackReturn, ...(options || {})};
      const openMaintenanceDetail = (recordId, options) => {
        const context = normalizeWorkOrderOptions(options, 'maintenanceManager');
        setWorkOrderContext({...context, recordId});
        navigate('maintenanceDetail');
      };
      const openMaintenanceForm = (recordId, options) => {
        const context = normalizeWorkOrderOptions(options, 'maintenanceManager');
        setWorkOrderContext({...context, recordId});
        navigate('maintenanceForm');
      };
      const returnFromWorkOrder = () => {
        if (currentPage === 'maintenanceForm' && workOrderContext.returnView === 'maintenanceDetail') {
          const detailReturnView = workOrderContext.detailReturnView || (workOrderContext.source === 'alertCenter' ? 'alarm' : 'maintenanceManager');
          setWorkOrderContext(prev => ({...prev, returnView: detailReturnView, detailReturnView: null}));
          navigate('maintenanceDetail');
          return;
        }
        navigate(workOrderContext.returnView);
      };
      const submitMaintenance = (payload) => {
        const record = getSelectedMaintenance();
        if (!record || record.status !== 'pending') return;
        if (workOrderContext.source === 'alertCenter') {
          const completedAlert = {...record, ...payload, status: 'completed'};
          setAlertRecords(prev => prev.map(item => item.id === record.id && item.status === 'pending' ? completedAlert : item));
          setMaintenanceRecords(prev => {
            const linkedId = record.linkedMaintenanceId;
            const existing = prev.find(item => (linkedId && item.id === linkedId) || (item.sourceType === 'alert' && item.sourceId === record.id));
            const maintenanceResult = {
              ...(existing || {}), id: existing?.id || `alert-maint-${record.id}`, sourceType: 'alert', sourceId: record.id,
              alertName: record.alertName, alertLevel: record.alertLevel, alertTime: record.alertTime,
              factoryId: record.factoryId, factoryName: record.factoryName, systemId: record.systemId, systemName: record.systemName || record.systemId,
              deviceName: record.deviceName, deviceCode: record.deviceCode, alertContent: record.alertContent,
              diagnosisConclusion: record.diagnosisConclusion, inspectionAdvice: record.inspectionAdvice,
              maintenanceContent: record.alertContent, scheduledTime: record.alertTime, ...payload, status: 'completed'
            };
            return existing ? prev.map(item => item.id === existing.id ? maintenanceResult : item) : [...prev, maintenanceResult];
          });
          setAlertView(prev => ({...prev, tab: 'history', historyPage: 1, scrollTop: 0, focusId: record.id}));
          showToast('告警处理完成，已同步历史维保记录');
          navigate('alarm');
          return;
        }
        setMaintenanceRecords(prev => prev.map(item => item.id === record.id && item.status === 'pending' ? {...item, ...payload, status: 'completed'} : item));
        setMaintenanceView(prev => ({...prev, tab: 'history', historyPage: 1}));
        showToast('处理完成，已归入历史维保记录');
        navigate('maintenanceManager');
      };
      
      const handleAddFactory = (newFactory) => {
        setFactoryList(prev => [...prev, newFactory]);
        setAddFactoryOpen(false);
      };
      
      const handleUpdateFactory = (updatedFactory) => {
        setFactoryList(prev => prev.map(f => f.id === updatedFactory.id ? updatedFactory : f));
      };
      
      const handleDeleteFactory = (factoryId) => {
        setFactoryList(prev => prev.filter(f => f.id !== factoryId));
      };
      
      const handleEditFactory = (factoryId) => {
        setEditingFactoryId(factoryId);
        setCurrentPage('factoryEdit');
      };
      
      const getEditingFactory = () => {
        return factoryList.find(f => f.id === editingFactoryId) || null;
      };
      
      const handleToggleFollow = (agentId) => {
        setFollowedAgents(prev => {
          if (prev.includes(agentId)) {
            showToast('已取消关注');
            return prev.filter(id => id !== agentId);
          } else {
            showToast('关注成功');
            return [...prev, agentId];
          }
        });
      };
      
      const handleSelectAgent = (agentId) => {
        setSelectedAgentId(agentId);
      };
      
      const handleStartChat = (name, avatar, initQ) => {
        setExpertName(name);
        setExpertAvatar(avatar);
        setExpertInitQ(initQ || null);
      };
      
      const getRunningStrategyCount = () => {
        return Object.values(strategyStatus).filter(Boolean).length;
      };
      
      const getSelectedAgent = () => {
        const agents = [
          { id: 1, name: '设备专家', avatar: '设', tags: ['AI智能', '设备团队', '设备管理'], org: '一号工厂设备部', desc: '擅长：设备全生命周期管理，故障诊断与维修策略制定。覆盖泵机、压缩机、换热器等关键设备。', consults: '12.5万人咨询' },
          { id: 2, name: '养殖专家', avatar: '养', tags: ['AI智能', '养殖团队', '水产养殖'], org: '养殖技术中心', desc: '擅长：水产养殖技术指导、病害防治、养殖密度优化。提供鱼类、虾类等养殖方案。', consults: '15.8万人咨询' },
          { id: 3, name: '能源专家', avatar: '能', tags: ['AI智能', '能源团队', '节能优化'], org: '厂区能源管理中心', desc: '擅长：能耗分析与优化策略，蒸汽系统、电力负荷优化。帮助企业降低能源成本15%-30%。', consults: '6.7万人咨询' }
        ];
        return agents.find(a => a.id === selectedAgentId) || agents[0];
      };
      
      return (
        <div className="iphone-frame">
          <div className="iphone-notch"></div>
          <div className="iphone-screen">
            {currentPage === 'login' && (
              <LoginPage 
                onNavigate={navigate}
                onToast={showToast}
              />
            )}
            {currentPage === 'home' && (
              <HomePage 
                onNavigate={navigate}
                onStickyNavigate={navigateFromHomeSticky}
                showToast={showToast}
                expandOpen={expandOpen}
                setExpandOpen={setExpandOpen}
                cameraOpen={cameraOpen}
                setCameraOpen={setCameraOpen}
                toast={toast}
                currentUser={currentUser}
                setCurrentUser={setCurrentUser}
                currentSystem={currentSystem}
                setCurrentSystem={setCurrentSystem}
                factoryList={factoryList}
                agentRef={agentRef}
                isChatExpanded={isChatExpanded}
                setShowChatHistory={setShowChatHistory}
                setIsChatExpanded={setIsChatExpanded}
              />
            )}
            {currentPage === 'archive' && (
              <HealthArchivePage 
                onNavigate={navigate}
                onExit={() => navigate('home')}
                onToast={showToast}
                factoryList={factoryList}
                onAddFactory={handleAddFactory}
                currentUser={currentUser}
                currentSystem={currentSystem}
                setCurrentSystem={setCurrentSystem}
                strategyStatus={strategyStatus}
                runningStrategyCount={getRunningStrategyCount()}
              />
            )}
            {currentPage === 'maintenanceManager' && (
              <MaintenanceManagerPage
                onExit={() => exitStickyModule('home')}
                onOpenCases={() => navigate('caseLibrary')}
                onOpenDetail={openMaintenanceDetail}
                onOpenForm={openMaintenanceForm}
                currentUser={currentUser}
                setCurrentUser={setCurrentUser}
                currentSystem={currentSystem}
                setCurrentSystem={setCurrentSystem}
                factoryList={factoryList}
                maintenanceRecords={maintenanceRecords}
                viewState={maintenanceView}
                setViewState={setMaintenanceView}
              />
            )}
            {currentPage === 'maintenanceDetail' && (
              <MaintenanceDetailPage record={getSelectedMaintenance()} onBack={returnFromWorkOrder} onProcess={() => openMaintenanceForm(workOrderContext.recordId, {source: workOrderContext.source, returnView: 'maintenanceDetail', detailReturnView: workOrderContext.returnView})} />
            )}
            {currentPage === 'maintenanceForm' && (
              <MaintenanceFormPage key={`${workOrderContext.source}-${workOrderContext.recordId}`} record={getSelectedMaintenance()} handlerName={getMaintenanceHandler()} onToast={showToast} onCancel={returnFromWorkOrder} onSubmit={submitMaintenance} />
            )}
            {currentPage === 'caseLibrary' && (
              <CaseLibraryPage records={maintenanceRecords} factoryList={factoryList} currentUser={currentUser} setCurrentUser={setCurrentUser} currentSystem={currentSystem} setCurrentSystem={setCurrentSystem} onBack={() => navigate('maintenanceManager')} onOpen={id => openMaintenanceDetail(id, 'caseLibrary')} />
            )}
            {currentPage === 'factoryPermission' && (
              <FactoryPermissionPage 
                onNavigate={navigate}
                onToast={showToast}
                factoryList={factoryList}
                onEditFactory={handleEditFactory}
              />
            )}
            {currentPage === 'factoryEdit' && (
              <FactoryEditPage 
                onNavigate={navigate}
                onToast={showToast}
                factory={getEditingFactory()}
                onSaveFactory={handleUpdateFactory}
                onDeleteFactory={handleDeleteFactory}
              />
            )}
            {currentPage === 'deviceList' && (
              <DeviceListPage 
                onNavigate={navigate}
                onToast={showToast}
                devices={devices}
                filters={deviceFilters}
                onFiltersChange={setDeviceFilters}
                onSelectDevice={(id) => {
                  setSelectedDeviceId(id);
                  navigate('deviceDetail');
                }}
              />
            )}
            {currentPage === 'deviceDetail' && (
              <DeviceDetailPage 
                onNavigate={navigate}
                onToast={showToast}
                device={getSelectedDevice()}
                onUpdateStatus={(status) => {
                  if (selectedDeviceId) {
                    const targetDevice = getSelectedDevice();
                    if (!targetDevice || getDeviceControlMode(targetDevice) !== 'remote') {
                      showToast('本地操控模式下不可远程修改');
                      return;
                    }
                    updateDeviceStatus(selectedDeviceId, status);
                  }
                }}
              />
            )}
            {currentPage === 'deviceArchive' && (
              <DeviceArchivePage 
                onNavigate={navigate}
                onToast={showToast}
                factoryList={factoryList}
                onAddFactory={handleAddFactory}
                currentUser={currentUser}
                currentSystem={currentSystem}
                setCurrentSystem={setCurrentSystem}
              />
            )}
            {currentPage === 'emergencyPlan' && (
              <EmergencyPlanPage 
                onNavigate={navigate}
                onToast={showToast}
                plans={emergencyPlans}
                planStatus={planStatus}
                onAddPlan={handleAddPlan}
                onDeletePlan={handleDeletePlan}
                onEditPlan={handleEditPlan}
                onSelectPlan={(id) => setSelectedPlanId(id)}
                onExecutePlan={executePlan}
                onStopPlan={stopPlan}
              />
            )}
            {currentPage === 'emergencyPlanDetail' && (
              <EmergencyPlanDetailPage 
                onNavigate={navigate}
                onToast={showToast}
                plan={getSelectedPlan()}
                planStatus={getPlanStatus(selectedPlanId)}
                faultyDevices={faultyDevices}
                onExecutePlan={executePlan}
                onStopPlan={stopPlan}
              />
            )}
            {currentPage === 'alarm' && (
              <AlarmPage 
                onExit={() => navigate('home')}
                onOpenDetail={recordId => openMaintenanceDetail(recordId, {source: 'alertCenter', returnView: 'alarm'})}
                onOpenForm={(recordId, returnView) => openMaintenanceForm(recordId, {source: 'alertCenter', returnView})}
                currentUser={currentUser}
                setCurrentUser={setCurrentUser}
                currentSystem={currentSystem}
                setCurrentSystem={setCurrentSystem}
                factoryList={factoryList}
                alertRecords={alertRecords}
                viewState={alertView}
                setViewState={setAlertView}
              />
            )}
            {currentPage === 'operationLog' && (
              <OperationLogPage
                onNavigate={navigate}
                onToast={showToast}
              />
            )}
            {currentPage === 'agent' && (
              <AgentPage 
                onNavigate={navigate}
                onToast={showToast}
                followedAgents={followedAgents}
                onToggleFollow={handleToggleFollow}
                onSelectAgent={handleSelectAgent}
              />
            )}
            {currentPage === 'agentDetail' && (
              <AgentDetailPage 
                onNavigate={navigate}
                onToast={showToast}
                agent={getSelectedAgent()}
                isFollowed={followedAgents.includes(selectedAgentId)}
                onToggleFollow={() => handleToggleFollow(selectedAgentId)}
                onStartChat={handleStartChat}
              />
            )}
            {currentPage === 'projectIntro' && (
              <ProjectIntroPage 
                onNavigate={navigate}
                onToast={showToast}
              />
            )}
            {currentPage === 'productIntro' && (
              <ProductIntroPage 
                onNavigate={navigate}
                onToast={showToast}
              />
            )}
            {currentPage === 'waterQuality' && (
              <WaterQualityDetailPage 
                onNavigate={navigate}
                onToast={showToast}
              />
            )}
            {currentPage === 'controlStrategy' && (
              <ControlStrategyPage
                onExit={() => navigate('archive')}
                onToast={showToast}
                strategyStatus={strategyStatus}
                setStrategyStatus={setStrategyStatus}
              />
            )}
            {currentPage === 'production' && (
              <ProductionDetailPage 
                onExit={() => exitStickyModule('home')}
                onToast={showToast}
                currentUser={currentUser}
                currentSystem={currentSystem}
                devices={devices}
                alertRecords={alertRecords}
                agentRef={agentRef}
              />
            )}
            {currentPage === 'knowledge' && (
              <KnowledgePage 
                onNavigate={navigate}
                onExit={() => exitStickyModule('archive')}
                onToast={showToast}
                currentUser={currentUser}
                knowledgeList={knowledgeList}
                setKnowledgeList={setKnowledgeList}
                knowledgeHistory={knowledgeHistory}
                addKnowledgeHistory={addKnowledgeHistory}
                restoreKnowledge={restoreKnowledge}
                agentRef={agentRef}
              />
            )}
            {currentPage === 'profile' && (
              <ProfilePage 
                onNavigate={navigate}
                onToast={showToast}
                factoryList={factoryList}
                onAddFactory={handleAddFactory}
                setFactoryList={setFactoryList}
              />
            )}
            {currentPage === 'chat' && (
              <ChatPage 
                onNavigate={navigate}
                onToast={showToast}
              />
            )}
            {/* 全局Agent对话框 - 除登录页外所有页面显示 */}
            {currentPage !== 'login' && (
              <AgentChatBar 
                onNavigate={navigate}
                onToast={showToast}
                currentUser={currentUser}
                currentSystem={currentSystem}
                currentPage={currentPage}
                agentRef={agentRef}
                hide={currentPage === 'production'}
                expertName={expertName}
                expertAvatar={expertAvatar}
                expertInitQ={expertInitQ}
                setExpertName={setExpertName}
                setExpertAvatar={setExpertAvatar}
                setExpertInitQ={setExpertInitQ}
                showChatHistory={showChatHistory}
                setShowChatHistory={setShowChatHistory}
                setIsChatExpanded={setIsChatExpanded}
                onArchiveKnowledgeUpload={archiveKnowledgeUpload}
              />
            )}
          </div>
        </div>
      );
    };
    
    const rootElement = document.getElementById('root');
    if (rootElement) {
      const root = ReactDOM.createRoot(rootElement);
      root.render(<App />);
    }

  </script>
</body>
</html>
