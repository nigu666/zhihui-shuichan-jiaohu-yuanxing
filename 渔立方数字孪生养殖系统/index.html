  const eventToggle=event.target.closest('[data-toggle-event]');if(eventToggle){const id=eventToggle.dataset.toggleEvent;expandedEventId=expandedEventId===id?null:id;renderEvents();return}
  const openEvent=event.target.closest('[data-open-event]');if(openEvent){openEventById(openEvent.dataset.openEvent);return}
  const stat=event.target.closest('.stat[data-filter]');if(stat){const filter=stat.dataset.filter;if(currentStatFilter===filter&&auxPanelState.open&&auxPanelState.type==='event-filter'&&auxPanelState.payload?.filter===filter){closeAuxPanel()}else{currentStatFilter=filter;renderStats();openAuxPanel('event-filter',{filter})}return}
  const more=event.target.closest('[data-more]');if(more){openAuxPanel(more.dataset.more);return}
  const rule=event.target.closest('[data-rule-id]');if(rule){openRuleConfig(rule.dataset.ruleId);return}
  const layout=event.target.closest('#layoutSwitch [data-layout]');if(layout){setVideoWallLayout(layout.dataset.layout);return}
  const toolToast=event.target.closest('[data-toast]');if(toolToast){toast(toolToast.dataset.toast);return}
});

function handleVideoWallDoubleClick(event){
  if(wallExpandTransitioning||event.target.closest('[data-action="fullscreen-expanded-camera"]'))return;
  const cell=event.target.closest('.video-wall-camera[data-camera-id],.expanded-camera-frame[data-camera-id]');if(!cell)return;
  const cameraId=cell.dataset.cameraId,camera=cameraProfiles[cameraId];if(!camera?.wallImage){toast('当前摄像头暂无可用画面');return}
  event.preventDefault();event.stopPropagation();selectedCamera=cameraId;toggleExpandedWallCamera(cameraId);
}
$('#wallGrid').addEventListener('dblclick',handleVideoWallDoubleClick);
$('#cameraFullscreenClose').onclick=()=>closeCameraFullscreenViewer();
$('#cameraFullscreenViewer').addEventListener('dblclick',event=>{if(event.target.closest('[data-action="exit-camera-fullscreen"]'))return;if(cameraFullscreenState.open)closeCameraFullscreenViewer()});
$('#systemNav').addEventListener('click',event=>{const button=event.target.closest('button');if(!button)return;$$('#systemNav button').forEach(item=>item.classList.toggle('active',item===button));if(button.dataset.system!=='home')toast(`${button.textContent.trim()}功能建设中`)});
$('#faultLegend').addEventListener('click',event=>{const button=event.target.closest('button[data-level]');if(!button)return;$$('#faultLegend button').forEach(item=>item.classList.toggle('selected',item===button));toast('当前无该等级设备')});
$('#userButton').onclick=()=>{$('#userMenu').hidden=!$('#userMenu').hidden};
$$('.topbar [data-toast]').forEach(button=>button.onclick=()=>toast(button.dataset.toast));
$('#globalSearch').addEventListener('keydown',event=>{if(event.key==='Enter'){const value=event.currentTarget.value.trim();toast(value?`正在搜索：${value}`:'请输入搜索内容')}});
$('#openVideoWallBtn').onclick=enterVideoWall;$('#openVideoWallToolBtn').onclick=enterVideoWall;$('#videoWallCollapseBtn').onclick=exitVideoWall;$('#videoWallCloseBtn').onclick=handleVideoWallClose;
$('#analysisTab').onclick=()=>{if(currentView!=='main')exitVideoWall();toast('已进入智能识别分析')};
$('#playButton').onclick=()=>{const button=$('#playButton');button.textContent=button.textContent==='Ⅱ'?'▶':'Ⅱ';toast(button.textContent==='Ⅱ'?'监控已继续播放':'监控已暂停')};
$('#mainBigViewButton').onclick=()=>{monitorBigView=true;updateMonitorBigView()};$('#monitorBigViewExitBtn').onclick=exitMonitorBigView;
$('#wallFull').onclick=()=>{if(wallFullscreenTransitioning)return;if(videoWallFullscreen)exitVideoWallFullscreen();else enterVideoWallFullscreen()};
$('#prevPage').onclick=previousVideoWallPage;$('#nextPage').onclick=nextVideoWallPage;
$('#patrolInterval').onchange=startPatrolTimer;$('#patrolButton').onclick=()=>{isPatrolling=!isPatrolling;$('#patrolButton').textContent=isPatrolling?'Ⅱ　暂停轮巡':'▶　开始轮巡';startPatrolTimer()};
$('#newWall').onclick=()=>{clearExpandedWallCamera({render:true,resumePatrol:true});openModal('wall')};$('#customLayout').onclick=openCustomLayout;$('#customRowsSelect').onchange=updateCustomLayoutPreview;$('#customColsSelect').onchange=updateCustomLayoutPreview;$('#wallSelect').onchange=()=>{clearExpandedWallCamera({render:true,resumePatrol:true});toast(`已切换至“${$('#wallSelect').value}”`)};
$('#modalCancel').onclick=closeModal;$('#modalConfirm').onclick=confirmModal;
$('#auxiliaryClose').onclick=closeAuxPanel;
$('#auxiliaryBody').addEventListener('click',event=>{const openEvent=event.target.closest('[data-open-event]');if(openEvent){openEventById(openEvent.dataset.openEvent);return}const openRule=event.target.closest('[data-open-rule]');if(openRule){openRuleConfig(openRule.dataset.openRule);return}const toggle=event.target.closest('[data-toggle-rule]');if(toggle)toggleRule(toggle.dataset.toggleRule)});
window.addEventListener('keydown',event=>{if(event.key!=='Escape')return;if(cameraFullscreenState.open){closeCameraFullscreenViewer();return}if(expandedWallCameraId){clearExpandedWallCamera({render:true,resumePatrol:true});return}if(videoWallFullscreen){exitVideoWallFullscreen();return}if(monitorBigView){exitMonitorBigView();return}if(!$('#overlay').hidden){closeModal();return}if(!$('#auxiliaryPanel').hidden)closeAuxPanel()});
window.addEventListener('beforeunload',()=>{stopPatrolTimer();clearInterval(clockTimer);clearTimeout(toastTimer);clearTimeout(viewTransitionTimer);clearTimeout(videoGridTransitionTimer);clearTimeout(wallExpandTimer);clearTimeout(cameraFullscreenTimer)});

renderCameraDetail();renderRightPanel();renderVideoWall();updateMonitorBigView();updateVideoWallFullscreenState({visual:false});updateClock();clockTimer=setInterval(updateClock,1000);
</script>
</body>
</html>
